<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f7f5"><title>Flow Ledger</title>
<style>
:root{--bg:#f7f7f5;--card:#fbfbfa;--ink:#151515;--muted:#6f6f6f;--line:#e3e3df;--soft:#ededeb;--red:#c83f3f;--blue:#2367c9;--shadow:0 8px 28px rgba(0,0,0,.06)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif}
body{padding:0 0 calc(94px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}
.app{width:min(100%,460px);margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:rgba(247,247,245,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05)}
.brand{display:flex;justify-content:space-between;align-items:flex-end}
.brand h1{font-size:24px;margin:0;font-weight:760;letter-spacing:-.6px}
.brand small{color:var(--muted);font-size:12px}
.content{padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.view{display:none}
.view.active{display:block}
.hero{background:#e9e9e6;color:var(--ink);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;color:#5f5f5f;text-transform:uppercase;letter-spacing:.12em}
.amount{font-size:38px;font-weight:750;letter-spacing:-1.2px;margin:8px 0 14px}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-stat{background:#f7f7f5;border-radius:15px;padding:12px}
.hero-stat b{display:block;font-size:17px;margin-top:4px}
.expense{color:var(--red)!important}
.income{color:var(--blue)!important}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.section-title h2{font-size:16px;margin:0}
.section-title span{font-size:12px;color:var(--muted)}
.card{background:#fbfbfa;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 3px 14px rgba(0,0,0,.025)}
.composer textarea{width:100%;min-height:126px;height:126px;max-height:126px;resize:none;overflow-y:auto;border:0;outline:0;font-size:17px;line-height:1.55;background:transparent;color:var(--ink)}
.quick{display:flex;gap:8px;overflow:auto;margin:14px 0;padding:0;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fbfbfa;border-radius:999px;padding:8px 11px;font-size:13px;color:#444}
.actions{display:grid;grid-template-columns:1fr 3fr;gap:9px;align-items:center}
.actions>*{height:46px;min-height:46px;max-height:46px;min-width:0;margin:0;align-self:center}
.actions .btn.icon{width:100%;height:46px;padding:0;font-size:30px;line-height:1;display:grid;place-items:center}
.actions .btn.grow{height:46px;display:grid;place-items:center;padding:0}
.actions .upload-plus{display:flex!important;align-items:center;justify-content:center;padding:0;overflow:hidden;line-height:1;font-size:0}
.actions .upload-plus .plus{display:block;font-size:34px;font-weight:800;line-height:1;transform:translateY(-1px)}
.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:650;background:#e6e6e2;color:var(--ink)}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.icon{width:45px;padding:0;display:grid;place-items:center;font-size:19px}
.btn.grow{flex:1}
.preview{margin-top:12px;background:#f3f3f0;border-radius:15px;padding:12px;font-size:13px;line-height:1.5;display:none}
.preview.show{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.left{display:flex;align-items:center;gap:11px;min-width:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px}
.meta{min-width:0}
.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:12px;color:var(--muted);margin-top:3px}
.value{text-align:right;font-weight:700}
.value small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#fbfbfa;border:1px solid var(--line);border-radius:18px;padding:14px}
.metric span{font-size:12px;color:var(--muted)}
.metric b{display:block;font-size:21px;margin-top:5px}
.overview-hero .metric small{line-height:1.35;min-height:16px}
.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:#8f8f8b;border-radius:99px}
.bar i.over{background:var(--red)}
.chart{display:flex;height:150px;align-items:flex-end;gap:8px;padding:12px 0 28px;overflow:visible}
.chart div{flex:1;background:#dcdcd8;border-radius:7px 7px 3px 3px;min-height:5px;position:relative}
.chart div:last-child{background:#9a9a95}
.chart div em{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#fbfbfa;padding:12px;outline:none}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:10px 2px}
.notice{font-size:12px;border-left:3px solid #888;padding:9px 11px;background:#f1f1ee;border-radius:4px 10px 10px 4px;line-height:1.5}
.tabbar{position:fixed;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),436px);background:rgba(214,214,210,.96);backdrop-filter:blur(18px);border-radius:25px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 10px 32px rgba(0,0,0,.25)}
.tab{border:0;background:transparent;color:#3f3f3f;border-radius:19px;padding:11px 8px;font-size:13px;font-weight:650}
.tab.active{background:#f7f7f5;color:#111}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}
.toast{position:fixed;z-index:20;left:50%;bottom:105px;transform:translate(-50%,15px);background:#d8d8d4;color:#111;padding:10px 15px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
@media(min-width:700px){body{padding-top:20px}.app{border:1px solid var(--line);border-radius:32px;overflow:hidden;min-height:850px;box-shadow:var(--shadow)}}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 2px 0}
.dist{display:grid;gap:11px}
.dist-row{display:grid;grid-template-columns:minmax(72px,auto) 1fr auto;gap:10px;align-items:center;font-size:13px}
.dist-track{height:8px;background:#e6e6e2;border-radius:99px;overflow:hidden}
.dist-fill{height:100%;background:#9b9b96;border-radius:99px}
.dist-value{font-weight:700;white-space:nowrap}
.overview-hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(108px,auto);gap:10px}
.overview-hero .metric{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.overview-hero .metric:first-child{grid-column:auto}
.month-chart{display:flex;height:160px;align-items:flex-end;gap:7px;padding:10px 0 28px}
.month-chart div{flex:1;min-width:0;background:#cececa;border-radius:6px 6px 2px 2px;position:relative;min-height:4px}
.month-chart em{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.ai-only{padding:13px;background:#f1f1ee;border-radius:14px;color:#555;font-size:13px;line-height:1.65}
textarea::placeholder{color:#92928e;opacity:1}
.recent-scroll{height:252px;min-height:252px;max-height:252px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#bdbdb8 transparent}
.recent-scroll::-webkit-scrollbar{width:5px}
.recent-scroll::-webkit-scrollbar-thumb{background:#bdbdb8;border-radius:9px}
.ai-summary{margin-top:18px}
.summary-body{min-height:98px;font-size:13px;line-height:1.7;color:#444;white-space:pre-wrap}
.summary-meta{font-size:11px;color:var(--muted);margin-top:8px}
.summary-loading{color:var(--muted)}
.day-stat{margin-top:10px}
</style></head>
<body><main class="app">

<section class="content">
<div id="inputView" class="view active">
  <div class="hero"><div class="eyebrow">当前可用资金</div><div class="amount" id="availableHero">¥0.00</div><div class="hero-row"><div class="hero-stat"><span>本月支出</span><b class="expense" id="monthExpense">¥0</b></div><div class="hero-stat"><span>本月收入</span><b class="income" id="monthIncome">¥0</b></div></div></div>

  <div class="quick"><button class="chip">☕ 咖啡 25 @微信</button><button class="chip">💰 工资收入 8000 到工资卡</button><button class="chip">↔️ 从微信转账500到储蓄卡</button><button class="chip">💳 用储蓄卡还信用卡1000</button></div>
  <div class="card composer"><textarea id="command" placeholder="#标签  @引用账户  （创建账户）\n支出/转入/转出/收入/还款 金额\n\\ 后面的内容作为备注\n日预算100 / 今天日预算150 / 11月5日至10日每天预算200\n//#、//@、//（）删除相关信息"></textarea><div id="preview" class="preview"></div><div class="actions"><label for="imageInput" class="btn secondary icon upload-plus" aria-label="上传图片"><span class="plus" aria-hidden="true">+</span></label><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"><div id="autoStatus" class="btn secondary grow" style="text-align:center;pointer-events:none">等待输入</div></div></div>

  <div class="section-title"><h2>最近记录</h2><span id="txCount">0 笔</span></div><div class="card recent-scroll" id="recentList"></div>
    <div class="section-title ai-summary"><h2>AI 消费总结</h2><span id="summaryRange">今日 · 本周 · 本月</span></div><div class="card"><div id="aiSummary" class="summary-body">暂无消费数据</div><div id="summaryMeta" class="summary-meta"></div></div>
</div>
<div id="overviewView" class="view">
    <div class="grid2 overview-hero"><div class="metric"><span>可用金额</span><b id="overviewAvailable">¥0.00</b></div><div class="metric"><span>月预算剩余</span><b id="budgetRemaining">¥0.00</b></div><div class="metric"><span>当日消费</span><b class="expense" id="todayExpense">¥0.00</b></div><div class="metric"><span>日预算剩余</span><b id="dailyBudgetRemaining">¥0.00</b><small id="dailyBudgetDetail" style="display:block;color:var(--muted);margin-top:5px"></small></div></div><span id="totalAssets" hidden></span><span id="creditDebt" hidden></span>
    <div class="section-title"><h2>可用金额分布</h2><span id="accountCount">0 个账户</span></div><div class="card dist" id="availableDist"></div>
    <div class="section-title"><h2>当日消费占比</h2><span id="todayExpenseText">¥0.00</span></div><div class="card dist" id="todayDist"></div>
    <div class="section-title"><h2>当月消费占比</h2><span id="monthExpenseText">¥0.00</span></div><div class="card dist" id="monthDist"></div>
    <div class="section-title"><h2>每月消费趋势</h2><span>近 6 个月</span></div><div class="card"><div id="monthlyTrend" class="month-chart"></div></div>
    <div class="section-title"><h2>账户明细</h2><span></span></div><div class="card" id="accountList"></div>
    <span id="budgetText" hidden></span><span id="budgetDetail" hidden></span><span id="budgetPct" hidden></span><i id="budgetBar" hidden></i><div id="trendChart" hidden></div><div id="categoryList" hidden></div>
  </div>
  <div id="settingsView" class="view">
    <div class="section-title"><h2>AI 连接</h2><span id="apiStatus">未配置</span></div><div class="card">
      <label>API 地址</label><input class="field" id="apiBase" value="https://api.deepseek.com">
      <label>文本模型</label><input class="field" id="textModel" value="deepseek-chat">
      <label>图片模型</label><input class="field" id="visionModel" value="deepseek-flash">
      <label>API Key</label><input class="field" id="apiKey" type="password" placeholder="sk-...">
      <label><input id="rememberKey" type="checkbox"> 在本机保存 API Key</label>
      <button id="saveApi" class="btn" style="width:100%;margin-top:14px">保存连接</button>
    </div>
    <div class="section-title"><h2>AI 自动管理</h2></div><div class="ai-only">账户创建、账户删除、标签、交易类型、月预算、固定日预算、指定日期或期间的日预算、账户引用、备注与日期时间均通过录入文字或图片自动识别，不再提供手动账户和预算控件。</div>
    <div class="section-title"><h2>数据管理</h2></div><div class="card"><button id="exportBtn" class="btn secondary" style="width:100%">导出本地 JSON 备份</button><label for="importInput" class="btn secondary" style="display:block;text-align:center;margin-top:9px;color:#151515">导入 JSON 备份</label><input id="importInput" type="file" accept="application/json"><button id="clearBtn" class="btn" style="width:100%;margin-top:9px;background:#e0d6d6;color:#7f2020">清空全部本地数据</button></div>
  </div>
</section></main>
<nav class="tabbar"><button class="tab active" data-view="inputView">录入</button><button class="tab" data-view="overviewView">总览</button><button class="tab" data-view="settingsView">设置</button></nav><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB={accounts:[],tx:[],tags:[],budget:{daily:0,monthly:0,dailyOverrides:[]},settings:{apiBase:'https://api.deepseek.com',textModel:'deepseek-chat',visionModel:'deepseek-flash',rememberKey:false,apiKey:'',timeOffsetMs:0,timeZone:'Asia/Kuala_Lumpur',lastTimeSync:0,lastSummaryKey:'',lastSummaryText:'',lastSummaryAt:0}};
const DEFAULT_SETTINGS={apiBase:'https://api.deepseek.com',textModel:'deepseek-chat',visionModel:'deepseek-flash',rememberKey:false,apiKey:'',timeOffsetMs:0,timeZone:'Asia/Kuala_Lumpur',lastTimeSync:0,lastSummaryKey:'',lastSummaryText:'',lastSummaryAt:0};
const DEFAULT_BUDGET={daily:0,monthly:0,dailyOverrides:[]};
const PRESET_TAGS=['加油','饮料','早餐','午餐','晚餐','保养','车险','过路费','房租','水电费','咖啡','电话费'];
const icons={早餐:'🥐',午餐:'🍱',晚餐:'🍲',餐饮:'🍜',饮料:'🥤',咖啡:'☕',零食:'🍪',交通:'🚕',加油:'⛽',保养:'🔧',车险:'🚗',过路费:'🛣️',房租:'🏠',水电费:'💡',电话费:'📱',购物:'🛍️',日用:'🧻',住房:'🏠',水电:'💡',娱乐:'🎬',医疗:'💊',教育:'📚',旅行:'✈️',收入:'💰',转账:'↔️',还款:'💳',其他:'•'};
const categoryRules=[['早餐',/早餐|早饭|包子|豆浆|油条/],['午餐',/午餐|午饭|中饭|工作餐/],['晚餐',/晚餐|晚饭|夜宵/],['咖啡',/咖啡|拿铁|美式|卡布奇诺/],['饮料',/饮料|奶茶|果汁|可乐|矿泉水|水(?!电)/],['零食',/零食|饼干|薯片|巧克力/],['餐饮',/餐|饭|面|外卖|火锅|烧烤/],['加油',/加油|汽油|柴油|油费/],['交通',/打车|出租车|滴滴|地铁|公交|停车|过路费|高速费/],['购物',/购物|买了|购买|淘宝|京东/],['日用',/日用|纸巾|洗衣液|清洁/],['住房',/房租|租金|物业|房贷/],['水电',/水费|电费|燃气|宽带/],['娱乐',/电影|游戏|演出|KTV/],['医疗',/药|医院|诊所|体检/],['教育',/课程|学费|书籍|培训/],['旅行',/机票|酒店|旅行|旅游/],['收入',/工资|奖金|收入|报销|退款/]];
const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}
const IDB_NAME='flow_ledger_db',IDB_STORE='state';
function openIDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function normalizeDB(x={}){
  DB.accounts=Array.isArray(x.accounts)?x.accounts:[];
  DB.tx=Array.isArray(x.tx)?x.tx:[];
  DB.tags=Array.isArray(x.tags)?x.tags:[];
  DB.budget={...DEFAULT_BUDGET,...(x.budget||{})};
  DB.budget.daily=Number(DB.budget.daily)||0;
  DB.budget.monthly=Number(DB.budget.monthly)||0;
  DB.budget.dailyOverrides=Array.isArray(DB.budget.dailyOverrides)?DB.budget.dailyOverrides:[];
  DB.settings={...DEFAULT_SETTINGS,...(x.settings||{})};
  DB.settings.timeOffsetMs=Number(DB.settings.timeOffsetMs)||0;
  DB.settings.lastTimeSync=Number(DB.settings.lastTimeSync)||0;
  DB.settings.lastSummaryAt=Number(DB.settings.lastSummaryAt)||0;
}
async function save(){const snapshot=JSON.parse(JSON.stringify(DB));if(!snapshot.settings.rememberKey)snapshot.settings.apiKey='';try{const db=await openIDB();await new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(snapshot,'ledger');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();localStorage.setItem('flow_ledger_storage_marker','indexeddb')}catch(e){localStorage.setItem('flow_ledger_v1',JSON.stringify(snapshot))}}
async function load(){let x=null;try{const db=await openIDB();x=await new Promise((resolve,reject)=>{const r=db.transaction(IDB_STORE).objectStore(IDB_STORE).get('ledger');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close()}catch(e){}if(!x){try{x=JSON.parse(localStorage.getItem('flow_ledger_v1'))}catch(e){}}normalizeDB(x||{});if(!DB.settings.rememberKey)DB.settings.apiKey=sessionStorage.getItem('flow_api_key')||'';else sessionStorage.removeItem('flow_api_key')}
function exportSnapshot(){const snapshot=JSON.parse(JSON.stringify(DB));snapshot.settings.apiKey='';return snapshot}
async function clearStorage(){try{await new Promise(resolve=>{const r=indexedDB.deleteDatabase(IDB_NAME);r.onsuccess=r.onerror=r.onblocked=()=>resolve()})}catch(e){}localStorage.removeItem('flow_ledger_v1');localStorage.removeItem('flow_ledger_storage_marker');sessionStorage.removeItem('flow_api_key')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function account(name,type='cash',balance=0,limit=0){let a=DB.accounts.find(x=>x.name===name);if(!a){a={id:uid(),name,type,balance:Number(balance),limit:Number(limit),used:type==='credit'?Number(balance):0,aliases:[],isDefault:false};DB.accounts.push(a)}return a}
function ensureDemo(){DB.tags=[...new Set([...PRESET_TAGS,...(DB.tags||[])])]}
function categoryOf(s){for(const [name,re] of categoryRules)if(re.test(s))return name;return'其他'}
function accountAliases(a){return [a.name,...(a.aliases||[])].filter(Boolean)}
function detectMentionedAccount(text){const lower=text.toLowerCase();return DB.accounts.find(a=>accountAliases(a).some(n=>lower.includes(String(n).toLowerCase())))}
function inferAccount(text,category,type){const direct=detectMentionedAccount(text);if(direct)return direct.name;const eligible=DB.accounts.filter(a=>type==='repayment'?a.type!=='credit':true);const scored=eligible.map(a=>{let score=0;for(const t of DB.tx.slice(0,100)){const same=(t.account===a.name||t.from===a.name);if(!same)continue;if(t.category===category)score+=4;else score+=1}if(a.isDefault)score+=3;return[a,score]}).sort((x,y)=>y[1]-x[1]);return scored[0]?.[0]?.name||DB.accounts[0]?.name||''}
function aiContext(){return JSON.stringify({accounts:DB.accounts.map(a=>({name:a.name,type:a.type,aliases:a.aliases||[],isDefault:!!a.isDefault})),recentPatterns:DB.tx.slice(0,30).map(t=>({account:t.account||t.from||'',category:t.category,note:t.note}))})}
function dateKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
