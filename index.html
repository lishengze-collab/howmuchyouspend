<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>法硕记忆助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2c5e4f;
            --primary-light: #f0f5f3;
            --bg-color: #fafafa;
            --text-main: #222222;
            --text-muted: #999999;
            --white: #ffffff;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px 10px;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            letter-spacing: 1px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 90px 20px;
            display: none;
        }
        .content.active { display: block; }

        /* 搜索框容器 */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 14px 45px 14px 45px; 
            border-radius: 30px;
            border: none;
            background-color: var(--bg-color);
            font-size: 17px;
            outline: none;
            transition: background 0.2s;
        }
        .search-box:focus { background-color: #eeeeee; }
        
        .icon-search, .icon-add {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            height: 100%;
            width: 45px;
            z-index: 2;
        }
        .icon-add { left: 0; color: var(--primary); }
        .icon-search { right: 0; }

        .hidden-input { display: none; }

        /* 科目滚动 */
        .subject-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .subject-scroll::-webkit-scrollbar { display: none; }
        
        .subject-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: var(--bg-color);
            color: var(--text-muted);
            font-size: 16px;
            transition: all 0.2s;
        }
        .subject-btn.active {
            background: var(--primary);
            color: var(--white);
            font-weight: 500;
        }

        /* 多级手风琴目录 */
        .tree-group { border-bottom: none; }
        .tree-title {
            padding: 14px 5px;
            font-size: 17px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            border-bottom: 1px solid #f0f0f0;
        }
        .tree-title.level-1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            border-bottom: none;
            padding: 18px 5px 10px 5px;
        }
        .tree-title.level-2 { padding-left: 15px; font-weight: 600; }
        .tree-title.level-3 { padding-left: 30px; color: #555; }
        
        .tree-title .arrow {
            transition: transform 0.3s;
            color: #ccc;
            font-size: 20px;
            padding-right: 5px;
        }
        .tree-title.active .arrow { transform: rotate(90deg); }
        
        .tree-children {
            display: none;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .tree-children.show { display: block; animation: fadeIn 0.3s ease; }
        
        .knowledge-item {
            padding: 14px 15px 14px 35px;
            font-size: 16px;
            color: #444;
            border-bottom: 1px solid #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            user-select: text;
        }
        .knowledge-item:last-child { border-bottom: none; }
        .knowledge-item::before {
            content: '•';
            color: var(--primary);
            margin-right: 8px;
            font-weight: bold;
        }
        .knowledge-item:active { background-color: #e8eceb; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.03);
            z-index: 20;
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 16px;
            flex: 1;
            text-align: center;
            height: 100%;
            line-height: 60px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }

        /* 弹窗基础 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: padding 0.3s;
        }
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            width: 100%;
            max-height: 85vh;
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            animation: scaleIn 0.25s ease;
            transition: all 0.3s ease;
        }
        .modal.fullscreen { padding: 0; }
        .modal-content.fullscreen {
            max-width: 100%;
            max-height: 100vh;
            height: 100vh;
            border-radius: 0;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            font-size: 17px;
            line-height: 1.7;
            color: #333;
            margin-bottom: 20px;
        }
        .modal-footer { display: flex; justify-content: center; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Markdown 排版 */
        .markdown-body h3 {
            color: var(--primary);
            font-size: 18px;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }
        .markdown-body h3:first-child { margin-top: 0; }
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin-bottom: 15px; }
        .markdown-body li { margin-bottom: 6px; }

        /* Flash Card 卡片 */
        .flashcard-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 10px 0;
            height: calc(100vh - 160px);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .flashcard-container::-webkit-scrollbar { display: none; }
        
        .flashcard {
            flex: 0 0 88%;
            scroll-snap-align: center;
            background: var(--bg-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
        }
        .flashcard.fullscreen {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            padding: 24px;
            border-radius: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .card-title {
            font-size: 19px; /* 标题稍大 */
            font-weight: 600;
            color: var(--primary);
            flex: 1;
            padding-right: 10px;
            cursor: pointer;
            user-select: none;
        }
        .delete-btn {
            color: #ff4d4f;
            font-size: 15px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            font-size: 17px; /* 放大卡片正文字体 */
            line-height: 1.7;
            color: #444;
            user-select: text;
        }
        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 设置页 */
        .stats-box {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .stats-val { font-weight: 600; color: var(--primary); }
        .setting-item { margin-bottom: 20px; }
        .setting-item label {
            display: block;
            font-size: 15px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .setting-item input {
            width: 100%;
            padding: 14px;
            border: 1px solid #eee;
            background: var(--bg-color);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: var(--white);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 12px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }
        .empty-state {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            margin-top: 100px;
            font-size: 16px;
        }

        /* 上传菜单弹窗 */
        .upload-menu {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            transition: bottom 0.3s ease;
            z-index: 101;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .upload-menu.active { bottom: 0; }
        .upload-option {
            padding: 16px;
            background: var(--bg-color);
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
        }
        .upload-cancel {
            padding: 16px;
            text-align: center;
            font-size: 17px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 10px;
        }

        /* 划词悬浮按钮 */
        .selection-btn {
            position: absolute;
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(44, 94, 79, 0.4);
            display: none;
            z-index: 1000;
            cursor: pointer;
            transform: translate(-50%, -100%);
            white-space: nowrap;
        }
        .selection-btn::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: var(--primary) transparent transparent transparent;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header" id="header-title">记忆助手</div>
    
    <!-- TAB 1: 查询 -->
    <div class="content active" id="tab-query">
        <div class="search-container">
            <div class="icon-add" onclick="showUploadMenu()">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="搜索或直接询问AI...">
            <div class="icon-search" onclick="triggerSearch()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
        
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input" onchange="handleFileUpload(event, 'image')">
        <input type="file" id="imageInput" accept="image/*" class="hidden-input" onchange="handleFileUpload(event, 'image')">
        <input type="file" id="textFileInput" accept=".txt,.md,.json,.csv" class="hidden-input" onchange="handleFileUpload(event, 'text')">
        
        <div class="subject-scroll" id="subjectList"></div>
        <div id="catalogList"></div>
    </div>

    <!-- TAB 2: 收藏 -->
    <div class="content" id="tab-favorites" style="padding: 0 10px 90px 10px;">
        <div class="flashcard-container" id="favoritesContainer"></div>
    </div>

    <!-- TAB 3: 设置 -->
    <div class="content" id="tab-settings">
        <div class="stats-box">
            <div class="stats-row"><span>API 调用次数</span> <span class="stats-val" id="stat-api-calls">0</span></div>
            <div class="stats-row"><span>估算 TOKEN 量</span> <span class="stats-val" id="stat-tokens">0</span></div>
            <div class="stats-row"><span>目录点击总次数</span> <span class="stats-val" id="stat-clicks">0</span></div>
        </div>

        <div class="setting-item">
            <label>DeepSeek API Key (仅本地存储)</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
        </div>

        <button class="btn-primary" onclick="saveApiKey()">保存 API Key</button>
        
        <div style="margin-top: 40px;">
            <button class="btn-outline" onclick="exportData()">导出数据备份</button>
            <button class="btn-outline" style="border-color: #ddd; color: #666;" onclick="document.getElementById('importFile').click()">导入数据恢复</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('query')">查询</div>
        <div class="nav-item" onclick="switchTab('favorites')">卡片</div>
        <div class="nav-item" onclick="switchTab('settings')">设置</div>
    </div>

    <!-- 上传菜单 -->
    <div class="modal" id="uploadModal" onclick="hideUploadMenu(event)">
        <div class="upload-menu" id="uploadMenu" onclick="event.stopPropagation()">
            <div class="upload-option" onclick="document.getElementById('cameraInput').click(); hideUploadMenu(event)">📷 打开相机</div>
            <div class="upload-option" onclick="document.getElementById('imageInput').click(); hideUploadMenu(event)">🖼️ 上传图片</div>
            <div class="upload-option" onclick="document.getElementById('textFileInput').click(); hideUploadMenu(event)">📄 上传文本文件</div>
            <div class="upload-cancel" onclick="hideUploadMenu(event)">取消</div>
        </div>
    </div>

    <!-- AI 弹窗 -->
    <div class="modal" id="aiModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-header" id="modalHeader" onclick="handleTripleClick('modal', event)">
                <span id="modalTitle">解析</span>
                <span style="color:#ccc; font-size: 28px; line-height: 1; cursor: pointer;" onclick="event.stopPropagation(); closeModal()">×</span>
            </div>
            <div class="modal-body markdown-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" id="favBtn" onclick="addToFavorites()">收藏此卡片</button>
            </div>
        </div>
    </div>

    <!-- 划词悬浮按钮 -->
    <div class="selection-btn" id="selectionBtn" ontouchstart="event.stopPropagation()" onmousedown="event.stopPropagation()" onclick="querySelection()">AI 查询</div>
</div>

<script>
    marked.setOptions({ breaks: true, gfm: true });

    const subjects = ["刑法", "民法", "法理学", "宪法学", "法制史", "政治", "刑诉法", "民诉法"];
    
    // 完整数据
    const knowledgeTree = {
        "刑法": [
            { title: "第一编 刑法总则", children: [
                { title: "第一章 绪论", children: [
                    { title: "第一节 刑法概述", items: ["刑法的概念与性质", "刑法的任务与体系", "刑法的解释方法"] },
                    { title: "第二节 基本原则", items: ["罪刑法定原则", "平等适用原则", "罪责刑相适应原则"] },
                    { title: "第三节 效力范围", items: ["空间效力（属地、属人、保护、普遍管辖）", "时间效力（从旧兼从轻）"] }
                ]},
                { title: "第二章 犯罪概念与构成", children: [
                    { title: "第一节 犯罪概念", items: ["形式概念与实质概念", "犯罪的基本特征"] },
                    { title: "第二节 犯罪构成", items: ["犯罪构成的体系与分类"] }
                ]},
                { title: "第三章 构成要件", children: [
                    { title: "第一节 客体", items: ["客体的概念与分类", "对象与客体的区别"] },
                    { title: "第二节 客观方面", items: ["危害行为（作为/不作为）", "危害结果", "刑法因果关系"] },
                    { title: "第三节 主体", items: ["刑事责任年龄", "刑事责任能力"] },
                    { title: "第四节 主观方面", items: ["故意与过失", "无罪过事件", "认识错误"] }
                ]},
                { title: "第四章 正当化事由", children: [
                    { title: "第一节 正当防卫", items: ["成立条件", "特殊防卫", "防卫过当"] },
                    { title: "第二节 紧急避险", items: ["成立条件", "避险过当"] }
                ]},
                { title: "第五章 停止形态", children: [
                    { title: "第一节 预备、未遂与中止", items: ["犯罪预备", "犯罪未遂", "犯罪中止"] }
                ]},
                { title: "第六章 共同犯罪", children: [
                    { title: "第一节 共犯形态", items: ["成立条件", "主犯、从犯、胁从犯、教唆犯", "共犯与身份"] }
                ]},
                { title: "第七章 罪数", children: [
                    { title: "第一节 罪数理论", items: ["实质一罪（想象竞合、结果加重、继续犯）", "处断一罪（连续、牵连、吸收）"] }
                ]},
                { title: "第八章至第十二章 刑罚论", children: [
                    { title: "第一节 刑罚体系", items: ["主刑与附加刑", "量刑情节", "累犯"] },
                    { title: "第二节 刑罚执行与消灭", items: ["自首与立功", "缓刑、减刑、假释", "追诉时效"] }
                ]}
            ]},
            { title: "第二编 刑法分则", children: [
                { title: "第十三章 各论概述", children: [{ title: "第一节 罪名与法定刑", items: ["罪状分类", "罪名确定", "法定刑种类"] }] },
                { title: "第十四章 危害国家安全罪", children: [{ title: "第一节 重点罪名", items: ["分裂国家罪", "颠覆国家政权罪", "间谍罪", "为境外窃取、刺探、收买、非法提供国家秘密、情报罪"] }] },
                { title: "第十五章 危害公共安全罪", children: [
                    { title: "第一节 危险方法类", items: ["放火罪", "爆炸罪", "以危险方法危害公共安全罪"] },
                    { title: "第二节 交通与责任事故类", items: ["交通肇事罪", "危险驾驶罪", "重大责任事故罪"] }
                ]},
                { title: "第十六章 破坏社会主义市场经济秩序罪", children: [
                    { title: "第一节 生产销售伪劣商品罪", items: ["生产、销售伪劣产品罪", "生产、销售、提供假药罪"] },
                    { title: "第二节 金融与税收犯罪", items: ["集资诈骗罪", "信用卡诈骗罪", "逃税罪", "洗钱罪"] },
                    { title: "第三节 知识产权与市场秩序", items: ["假冒注册商标罪", "侵犯商业秘密罪", "合同诈骗罪", "非法经营罪"] }
                ]},
                { title: "第十七章 侵犯人身权利、民主权利罪", children: [
                    { title: "第一节 生命健康与自由", items: ["故意杀人罪", "故意伤害罪", "非法拘禁罪", "绑架罪"] },
                    { title: "第二节 妇女儿童与人格名誉", items: ["强奸罪", "拐卖妇女、儿童罪", "侮辱罪", "诽谤罪"] }

    function renderSubjects() {
        const container = document.getElementById('subjectList');
        container.innerHTML = subjects.map(sub => 
            `<button class="subject-btn ${sub === currentSubject ? 'active' : ''}" onclick="changeSubject('${sub}')">${sub}</button>`
        ).join('');
    }

    function changeSubject(sub) {
        currentSubject = sub;
        renderSubjects();
        renderCatalog(sub);
    }

    function buildTreeDOM(nodes, level = 1) {
        return nodes.map(node => {
            if (node.items) {
                return `
                    <div class="leaf-container">
                        ${node.items.map(item => `<div class="knowledge-item" onclick="queryAI('${node.title} - ${item}')">${item}</div>`).join('')}
                    </div>
                `;
            } else {
                const uniqueId = 'node_' + Math.random().toString(36).substr(2, 9);
                return `
                    <div class="tree-group">
                        <div class="tree-title level-${level}" onclick="toggleNode('${uniqueId}', this)">
                            <span>${node.title}</span>
                            <span class="arrow">›</span>
                        </div>
                        <div class="tree-children" id="${uniqueId}">
                            ${buildTreeDOM(node.children, level + 1)}
                        </div>
                    </div>
                `;
            }
        }).join('');
    }

    function renderCatalog(sub) {
        const container = document.getElementById('catalogList');
        const chapters = knowledgeTree[sub] || [];
        
        if(chapters.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px; font-size:16px;">暂无数据，可直接在搜索框查询</div>';
            return;
        }
        container.innerHTML = buildTreeDOM(chapters, 1);
    }

    function toggleNode(id, titleEl) {
        const itemsContainer = document.getElementById(id);
        if (itemsContainer.classList.contains('show')) {
            itemsContainer.classList.remove('show');
            titleEl.classList.remove('active');
        } else {
            itemsContainer.classList.add('show');
            titleEl.classList.add('active');
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        
        const navs = document.querySelectorAll('.nav-item');
        if(tabId === 'query') navs[0].classList.add('active');
        if(tabId === 'favorites') navs[1].classList.add('active');
        if(tabId === 'settings') navs[2].classList.add('active');

        const titles = {query: '记忆助手', favorites: '知识卡片', settings: '统计与设置'};
        document.getElementById('header-title').innerText = titles[tabId];

        if(tabId === 'favorites') renderFavorites();
        if(tabId === 'settings') updateStatsUI();
    }

    function triggerSearch() {
        const input = document.getElementById('searchInput');
        const val = input.value.trim();
        if (val) {
            input.blur(); 
            queryAI(val);
            input.value = ''; 
        }
    }

    function handleFileUpload(event, type) {
        const file = event.target.files[0];
        if (!file) return;
        
        const modal = document.getElementById('aiModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const favBtn = document.getElementById('favBtn');
        
        modal.classList.add('active');
        modalTitle.innerText = type === 'image' ? "图像解析" : "文档解析";
        modalBody.innerHTML = '<div style="text-align:center; padding:20px; color:#888; font-size:17px;">正在读取文件并生成解析...</div>';
        favBtn.disabled = true;
        favBtn.style.opacity = '0.5';
        currentAIKeyword = type === 'image' ? "图像内容解析" : "文档内容解析";
        
        const reader = new FileReader();

        reader.onload = async function(e) {
            if (type === 'text') {
                const textContent = e.target.result;
                if (!apiKey) {
                    setTimeout(() => {
                        currentAIContent = `### 文档模拟解析\n\n由于未配置 API Key，无法进行真实解析。\n\n### 文档内容摘要\n${textContent.substring(0, 100)}...`;
                        modalBody.innerHTML = marked.parse(currentAIContent);
                        favBtn.disabled = false;
                        favBtn.style.opacity = '1';
                    }, 600);
                    return;
                }
                try {
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "deepseek-chat",
                            messages: [
                                {"role": "system", "content": "你是法硕考研/考研政治专家。请解析以下上传的文本内容，提取知识点并按照Markdown格式输出：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解）\n\n### 考点\n（分点罗列）\n\n### 法条详情/核心表述\n（引用原文）"},
                                {"role": "user", "content": `以下是上传的文件内容：\n${textContent}`}
                            ]
                        })
                    });
                    const data = await response.json();
                    if(data.choices && data.choices.length > 0) {
                        currentAIContent = data.choices[0].message.content;
                        modalBody.innerHTML = marked.parse(currentAIContent);
                        stats.apiCalls++;
                        stats.tokens += Math.floor(textContent.length + currentAIContent.length);
                        saveStats();
                        favBtn.disabled = false;
                        favBtn.style.opacity = '1';
                    }
                } catch (error) {
                    modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
                }
            } else {
                const base64 = e.target.result;
                if (!apiKey) {
                    setTimeout(() => {
                        currentAIContent = `### 图像模拟解析\n\n由于未配置 API Key，无法进行多模态识别。\n\n建议配置支持视觉的模型（如 GPT-4o, Qwen-VL 等）。`;
                        modalBody.innerHTML = marked.parse(currentAIContent);
                        favBtn.disabled = false;
                        favBtn.style.opacity = '1';
                    }, 1000);
                    return;
                }
                try {
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "deepseek-chat", 
                            messages: [
                                {
                                    "role": "user", 
                                    "content": [
                                        {"type": "text", "text": "请识别这张图片中的法硕/考研知识点，并严格按照以下Markdown格式输出：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解）\n\n### 考点\n（分点罗列）\n\n### 法条详情\n（引用原文）"},
                                        {"type": "image_url", "image_url": {"url": base64}}
                                    ]
                                }
                            ]
                        })
                    });
                    const data = await response.json();
                    if(data.choices && data.choices.length > 0) {
                        currentAIContent = data.choices[0].message.content;
                        modalBody.innerHTML = marked.parse(currentAIContent);
                        stats.apiCalls++;
                        stats.tokens += 1000;
                        saveStats();
                        favBtn.disabled = false;
                        favBtn.style.opacity = '1';
                    } else {
                        modalBody.innerHTML = "<span style='color:red'>API 返回异常，请确认您的模型是否支持图像输入。</span>";
                    }
                } catch (error) {
                    modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
                }
            }
            event.target.value = '';
        };

        if (type === 'text') {
            reader.readAsText(file);
        } else {
            reader.readAsDataURL(file);
        }
    }

    async function queryAI(keyword) {
        stats.clicks++;
        saveStats();

        const modal = document.getElementById('aiModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const favBtn = document.getElementById('favBtn');
        
        modal.classList.add('active');
        modalTitle.innerText = keyword;
        modalBody.innerHTML = '<div style="text-align:center; padding:20px; color:#888; font-size:17px;">正在生成解析...</div>';
        favBtn.disabled = true;
        favBtn.style.opacity = '0.5';
        currentAIKeyword = keyword;

        resetFullscreen('modal');

        if (!apiKey) {
            setTimeout(() => {
                currentAIContent = `### 知识点\n${keyword}\n\n### 定义\n这是关于“${keyword}”的法学/政治核心概念。\n\n### 理解\n具有法定性、强制性。需结合具体语境拆解。\n\n### 考点\n常考简答题、选择题。注意区分相邻概念。\n\n### 法条详情/核心表述\n《XXX》第X条...\n\n*(⚠️ 当前为模拟数据，请在设置中填入API Key)*`;
                modalBody.innerHTML = marked.parse(currentAIContent);
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            }, 600);
            return;
        }

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {"role": "system", "content": "你是法硕考研/考研政治专家。请严格按照以下Markdown格式输出，不要客套话：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解法理或原理）\n\n### 考点\n（分点罗列常考点、易混淆点）\n\n### 法条详情/核心表述\n（引用法条原文或经典表述）"},
                        {"role": "user", "content": keyword}
                    ]
                })
            });

            const data = await response.json();
            if(data.choices && data.choices.length > 0) {
                currentAIContent = data.choices[0].message.content;
                modalBody.innerHTML = marked.parse(currentAIContent);
                
                stats.apiCalls++;
                stats.tokens += Math.floor((keyword.length + currentAIContent.length));
                saveStats();
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            } else {
                modalBody.innerHTML = "<span style='color:red'>API 返回异常。</span>";
            }
        } catch (error) {
            modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
        }
    }

    function closeModal() {
        document.getElementById('aiModal').classList.remove('active');
        resetFullscreen('modal');
    }

    function handleTripleClick(type, event) {
        if(event.target.tagName.toLowerCase() === 'span' && event.target.innerText === '×') return; 

        clickCount++;
        if (clickCount === 1) {
            clickTimer = setTimeout(() => { clickCount = 0; }, 600);
        } else if (clickCount >= 3) {
            clearTimeout(clickTimer);
            clickCount = 0;
            toggleFullscreen(type);
        }
    }

    function toggleFullscreen(type) {
        if (type === 'modal') {
            document.getElementById('aiModal').classList.toggle('fullscreen');
            document.getElementById('modalContent').classList.toggle('fullscreen');
        }
    }
    function resetFullscreen(type) {
        if (type === 'modal') {
            document.getElementById('aiModal').classList.remove('fullscreen');
            document.getElementById('modalContent').classList.remove('fullscreen');
        }
    }

    let cardClickCount = 0;
    let cardClickTimer = null;
    function handleCardTripleClick(cardElement) {
        cardClickCount++;
        if (cardClickCount === 1) {
            cardClickTimer = setTimeout(() => { cardClickCount = 0; }, 600);
        } else if (cardClickCount >= 3) {
            clearTimeout(cardClickTimer);
            cardClickCount = 0;
            cardElement.classList.toggle('fullscreen');
            if(cardElement.classList.contains('fullscreen')) {
                cardElement.parentElement.style.scrollSnapType = 'none'; 
            } else {
                cardElement.parentElement.style.scrollSnapType = 'x mandatory';
            }
        }
    }

    function addToFavorites() {
        if(!currentAIKeyword || !currentAIContent) return;

        const newFav = {
            id: Date.now(),
            title: currentAIKeyword,
            content: currentAIContent,
            time: new Date().toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})
        };

        favorites.push(newFav);
        saveFavorites();
        closeModal();
        alert('已收藏至卡片');
    }

    function renderFavorites() {
        const container = document.getElementById('favoritesContainer');
        if(favorites.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无卡片，快去查询并收藏吧~</div>';
            return;
        }

        const sortedFavs = [...favorites].reverse();
        
        container.innerHTML = sortedFavs.map(fav => {
            return `
            <div class="flashcard" id="card-${fav.id}">
                <div class="card-header">
                    <div class="card-title" onclick="handleCardTripleClick(document.getElementById('card-${fav.id}'))">${fav.title}</div>
                    <button class="delete-btn" onclick="deleteFavorite(${fav.id}, event)">删除</button>
                </div>
                <div class="card-body markdown-body">
                    ${marked.parse(fav.content)}
                </div>
                <div class="card-footer">${fav.time}</div>
            </div>
            `;
        }).join('');
    }

    function deleteFavorite(id, event) {
        event.stopPropagation(); 
        if(confirm('确定删除这张卡片吗？')) {
            favorites = favorites.filter(f => f.id !== id);
            saveFavorites();
            renderFavorites();
        }
    }

    const selectionBtn = document.getElementById('selectionBtn');
    
    function handleSelection() {
        const selection = window.getSelection();
        const text = selection.toString().trim();
        
        if (text.length > 0 && text.length < 50) { 
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            
            const appRect = document.getElementById('app').getBoundingClientRect();
            const x = rect.left - appRect.left + (rect.width / 2);
            const y = rect.top - appRect.top + window.scrollY - 10;

            selectionBtn.style.left = `${x}px`;
            selectionBtn.style.top = `${y}px`;
            selectionBtn.style.display = 'block';
            selectionBtn.dataset.text = text;
        } else {
            selectionBtn.style.display = 'none';
        }
    }

    // 修复：点击按钮时，不要让 document 监听器拦截/隐藏了按钮
    document.addEventListener('mouseup', (e) => {
        if(e.target !== selectionBtn) handleSelection();
    });
    document.addEventListener('touchend', (e) => {
        if(e.target !== selectionBtn) handleSelection();
    });
    document.addEventListener('mousedown', (e) => { 
        if(e.target !== selectionBtn) selectionBtn.style.display = 'none'; 
    });
    document.addEventListener('touchstart', (e) => { 
        if(e.target !== selectionBtn) selectionBtn.style.display = 'none'; 
    }, {passive: true});

    function querySelection() {
        const text = selectionBtn.dataset.text;
        if(text) {
            window.getSelection().removeAllRanges(); 
            selectionBtn.style.display = 'none';
            queryAI(text);
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        apiKey = key;
        localStorage.setItem('fs_api_key', key);
        alert('API Key 已保存');
    }

    function updateStatsUI() {
        document.getElementById('stat-api-calls').innerText = stats.apiCalls;
        document.getElementById('stat-tokens').innerText = stats.tokens;
        document.getElementById('stat-clicks').innerText = stats.clicks;
    }

    function saveStats() {
        localStorage.setItem('fs_stats', JSON.stringify(stats));
        updateStatsUI();
    }

    function saveFavorites() {
        localStorage.setItem('fs_favorites', JSON.stringify(favorites));
    }

    function exportData() {
        const data = { favorites, stats, exportTime: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fashuo_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.favorites && data.stats) {
                    favorites = data.favorites;
                    stats = data.stats;
                    saveFavorites();
                    saveStats();
                    renderFavorites();
                    updateStatsUI();
                    alert('数据恢复成功！');
                } else {
                    alert('文件格式不正确');
                }
            } catch (err) {
                alert('读取文件失败');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            triggerSearch();
        }
    });

    init();
</script>
