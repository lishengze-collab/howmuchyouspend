<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>法硕记忆助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --primary:#2c5e4f;
  --primary-dark:#1d4337;
  --primary-soft:#eef4f1;
  --accent:#b7791f;
  --bg:#f4f6f5;
  --card:#ffffff;
  --text:#1f2a26;
  --text-2:#52605a;
  --muted:#8b9791;
  --line:#e5eae7;
  --danger:#c0392b;
  --radius:16px;
  --read:17px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:#fff;color:var(--text);display:flex;justify-content:center;overflow:hidden;
  height:100vh;height:100dvh;
}
@media (min-width:481px){html,body{background:var(--bg)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{width:100%;max-width:480px;background:var(--card);position:relative;height:100%;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);padding-top:env(safe-area-inset-top)}
.content{flex:1;overflow-y:auto;padding:16px 18px 120px;display:none;-webkit-overflow-scrolling:touch}
.content.active{display:block}

/* 搜索 */
.search-row{display:flex;gap:10px;align-items:center}
.search-box{flex:1;min-width:0;padding:13px 18px;border-radius:26px;border:1px solid transparent;background:var(--bg);font-size:16px;outline:none;color:var(--text);transition:all .2s}
.search-box:focus{background:#fff;border-color:var(--primary)}
.ask-btn{flex-shrink:0;padding:12px 18px;border-radius:26px;background:var(--primary);color:#fff;font-size:15px;font-weight:600}
.upload-link{display:inline-block;margin:10px 4px 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.hidden-input{display:none}

/* 科目 */
.subject-bar{display:flex;align-items:center;gap:10px;margin:16px 0 0}
.subject-scroll{display:flex;overflow-x:auto;gap:8px;flex:1;scrollbar-width:none;padding:2px 0}
.subject-scroll::-webkit-scrollbar{display:none}
.subject-btn{flex-shrink:0;padding:8px 15px;border-radius:18px;background:var(--bg);color:var(--text-2);font-size:15px;transition:all .2s}
.subject-btn.active{background:var(--primary);color:#fff;font-weight:600}
.edit-btn{flex-shrink:0;padding:8px 14px;border-radius:18px;border:1px solid var(--primary);color:var(--primary);font-size:14px;font-weight:600}
.edit-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.meta-row{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;font-size:13.5px;color:var(--muted)}
.meta-row .links button{font-size:13.5px;color:var(--primary);padding:2px 6px}
.meta-row .links i{color:var(--line);font-style:normal}

/* 编辑提示 */
.edit-banner{display:none;margin:8px 0 6px;padding:12px 14px;border-radius:12px;background:#fdf6e7;border:1px solid #f1e1b8;font-size:14px;color:#7a5614;line-height:1.6}
.edit-banner.show{display:block}
.eb-actions{display:flex;gap:10px;margin-top:10px}
.eb-actions button{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;background:#fff;border:1px solid #e6cf9b;color:#7a5614}
.eb-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* 目录树 */
.node{margin-top:2px}
.node-head{display:flex;align-items:center}
.node-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:13px 6px;cursor:pointer}
.node-title{flex:1;min-width:0;line-height:1.45}
.cnt{flex-shrink:0;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:10px}
.chev{flex-shrink:0;width:8px;height:8px;border-right:2px solid #b4beb9;border-bottom:2px solid #b4beb9;transform:rotate(-45deg);transition:transform .2s;margin:0 4px 0 2px}
.node.open>.node-head .chev{transform:rotate(45deg)}
.node-body{display:none}
.node.open>.node-body{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.node.lv1{margin-top:14px;background:var(--primary-soft);border-radius:14px;padding:0 6px 4px}
.node.lv1>.node-head .node-main{padding:15px 8px}
.node.lv1>.node-head .node-title{font-size:17.5px;font-weight:700;color:var(--primary-dark)}
.node.lv1>.node-head .cnt{background:#fff}
.node.lv2>.node-head .node-title{font-size:16.5px;font-weight:600;color:var(--text)}
.node.lv3>.node-head .node-title{font-size:16px;font-weight:600;color:var(--text-2)}
.node.lv4>.node-head .node-title{font-size:15.5px;font-weight:500;color:var(--text-2)}
.node.lv2>.node-body,.node.lv3>.node-body,.node.lv4>.node-body{margin-left:12px;padding-left:10px;border-left:2px solid #d9e3de}

.leaf{display:flex;align-items:center}
.leaf-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;padding:11px 8px;font-size:16px;color:var(--text);line-height:1.5;cursor:pointer;border-radius:8px}
.leaf-main::before{content:'';flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--primary);opacity:.55;transform:translateY(-3px)}
.leaf-main:active{background:rgba(44,94,79,.1)}
.leaf-t{flex:1;min-width:0}
.hit{flex-shrink:0;align-self:center;min-width:20px;padding:1px 7px;border-radius:10px;background:var(--bg);color:var(--muted);font-size:11.5px;line-height:1.5;text-align:center;font-variant-numeric:tabular-nums}
.hit.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.node.lv1 .hit{background:#fff}
.node.lv1 .hit.on{background:#fff}
mark{background:rgba(183,121,31,.28);color:inherit;border-radius:3px;padding:0 1px}
.mgr{flex-shrink:0;margin-left:6px;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:600;background:#fff;color:var(--primary);border:1px solid #cddbd5}
.empty{text-align:center;color:var(--muted);margin-top:60px;font-size:15px;line-height:1.8;padding:0 10px}

/* 底部导航 */
.bottom-nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:80%;height:58px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.08);display:flex;border:1px solid rgba(0,0,0,.04);z-index:20}
.nav-item{flex:1;text-align:center;line-height:58px;font-size:16px;color:var(--muted);transition:color .2s}
.nav-item.active{color:var(--primary);font-weight:700}

/* 弹层 */
.layer{position:fixed;inset:0;background:rgba(18,28,24,.48);z-index:200;display:none;align-items:flex-end;justify-content:center}
.layer.show{display:flex}
.layer.center{align-items:center;padding:20px}
#reader{background:#e4e9e6}
#reader.full-bg{background:#fff}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh;overflow-y:auto;animation:up .25s ease}
.layer.center .sheet{border-radius:20px;padding-bottom:20px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sh-title{font-size:19px;font-weight:700;color:var(--primary-dark);line-height:1.4}
.sh-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-top:6px}
.sh-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sh-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 16px;border-radius:12px;background:var(--bg);font-size:16.5px;font-weight:600;color:var(--primary-dark)}
.sh-item small{font-size:13px;font-weight:400;color:var(--muted)}
.sh-item.danger{color:var(--danger)}
.sh-item:disabled{opacity:.4}
.sh-cancel{width:100%;margin-top:10px;padding:14px;font-size:16px;color:var(--muted)}
.sheet textarea,.sheet input[type=text]{width:100%;margin-top:14px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;line-height:1.7;color:var(--text);outline:none;font-family:inherit;resize:vertical}
.sheet textarea:focus,.sheet input[type=text]:focus{border-color:var(--primary);background:#fff}
.sh-btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--text-2)}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.45}
.hint-box{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);font-size:13px;line-height:1.7;color:var(--text-2);white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}

/* 阅读器 */
.reader{width:100%;max-width:480px;height:90vh;height:90dvh;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease;overflow:hidden}
.reader.full{height:100vh;height:100dvh;border-radius:0}
.rd-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.reader.full .rd-head{padding-top:calc(18px + env(safe-area-inset-top))}
.rd-titles{flex:1;min-width:0}
.rd-title{font-size:21px;font-weight:700;line-height:1.35;color:var(--primary-dark);word-break:break-word;user-select:none}
.rd-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.rd-tools{display:flex;gap:6px;flex-shrink:0}
.rd-tools button{padding:6px 12px;border-radius:14px;background:var(--bg);font-size:13.5px;color:var(--text-2);font-weight:600}
.rd-body{flex:1;overflow-y:auto;padding:18px 22px 26px;-webkit-overflow-scrolling:touch}
.rd-foot{display:flex;align-items:center;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rd-foot .step{display:flex;gap:6px}
.rd-foot .step button{width:44px;padding:11px 0;border-radius:12px;background:var(--bg);font-weight:700;color:var(--text-2)}
.rd-foot .btn{flex:1}
.loading{text-align:center;padding:50px 10px;color:var(--muted);font-size:16px}
.loading::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.notice{padding:30px 6px;text-align:center;color:var(--text-2);line-height:1.8;font-size:16px}
.notice .btn{margin-top:16px;max-width:220px}
.err{color:var(--danger);line-height:1.8;font-size:16px}

/* Markdown 阅读排版 */
.md{font-size:var(--read);line-height:1.85;color:var(--text);word-break:break-word;letter-spacing:.02em}
.md h3{font-size:calc(var(--read) + 2px);margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--primary);color:var(--primary-dark);font-weight:700;line-height:1.4}
.md>h3:first-child{margin-top:2px}
.md h4{font-size:calc(var(--read) + 1px);margin:18px 0 8px;font-weight:700;color:var(--text)}
.md p{margin:0 0 14px}
.md ul,.md ol{padding-left:1.4em;margin:0 0 14px}
.md li{margin-bottom:10px;padding-left:2px}
.md li::marker{color:var(--primary);font-weight:700}
.md li>ul,.md li>ol{margin:8px 0 0}
.md li .sent{display:block;margin-top:7px}
.md li .sent:first-child{margin-top:0}
.md strong{font-weight:700;color:var(--primary-dark);background:linear-gradient(transparent 62%,rgba(183,121,31,.24) 0)}
.md blockquote{margin:6px 0 16px;padding:12px 16px;background:var(--primary-soft);border-left:3px solid var(--primary);border-radius:0 12px 12px 0;color:#33413b;font-size:calc(var(--read) - 1px);line-height:1.8}
.md blockquote p:last-child{margin:0}
.md table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;font-size:calc(var(--read) - 2px);margin:10px 0 16px}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;text-align:left;line-height:1.6}
.md th{background:var(--primary-soft);font-weight:700}
.md code{background:#f0f3f1;padding:2px 6px;border-radius:5px;font-size:.9em}
.md hr{border:0;border-top:1px solid var(--line);margin:20px 0}

/* 卡片 */
#tab-favorites.active{display:flex;flex-direction:column;padding:14px 0 100px}
.fav-bar{display:none;justify-content:space-between;align-items:center;padding:4px 20px 10px;font-size:13.5px;color:var(--muted)}
.fav-bar b{color:var(--primary);font-size:15px}
.flashcard-container{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.flashcard-container::-webkit-scrollbar{display:none}
.flashcard{flex:0 0 calc(100% - 4px);scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 18px rgba(30,60,50,.07);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.fc-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);background:linear-gradient(#f7faf8,#fff)}
.fc-title{font-size:21px;font-weight:700;color:var(--primary-dark);line-height:1.35;word-break:break-word}
.tag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-size:12.5px;font-weight:600}
.fc-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 20px;-webkit-overflow-scrolling:touch}
.fc-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 10px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fc-foot button{padding:6px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--primary)}
.fc-foot button.danger{color:var(--danger)}
.empty-fav{width:100%;text-align:center;color:var(--muted);margin-top:90px;font-size:15px;line-height:1.9;padding:0 30px}

/* 设置 */
.card-box{background:var(--bg);padding:18px 20px;border-radius:var(--radius);margin-bottom:18px}
.stats-row{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}
.stats-val{font-weight:700;color:var(--primary)}
.set-title{font-size:14px;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.set-input{width:100%;padding:14px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:16px;outline:none;color:var(--text)}
.set-input:focus{border-color:var(--primary);background:#fff}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-size:15px;color:var(--text-2)}
.seg button.active{background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.preview{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--primary-soft)}
.btn-outline{width:100%;padding:14px;background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:12px;font-size:16px;margin-top:10px}
.btn-outline.gray{border-color:#d9dfdc;color:var(--text-2)}
.btn-block{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600}

/* 划词 */
.selection-btn{position:fixed;background:var(--primary);color:#fff;padding:9px 18px;border-radius:20px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(44,94,79,.4);display:none;z-index:1000;cursor:pointer;transform:translate(-50%,-100%);white-space:nowrap;user-select:none;-webkit-user-select:none}
.selection-btn::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-width:6px 6px 0;border-style:solid;border-color:var(--primary) transparent transparent transparent}
.selection-btn.below{transform:translate(-50%,0)}
.selection-btn.below::after{display:none}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(25,35,31,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:15px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- 查询 -->
  <div class="content active" id="tab-query">
    <div class="search-row">
      <input type="text" class="search-box" id="searchInput" placeholder="筛选目录，回车或点「问 AI」直接提问" enterkeyhint="search">
      <button class="ask-btn" onclick="triggerAsk()">问 AI</button>
    </div>
    <button class="upload-link" onclick="showUploadMenu()">上传图片或文档，让 AI 解析</button>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input" onchange="handleFileUpload(event,'image')">
    <input type="file" id="imageInput" accept="image/*" class="hidden-input" onchange="handleFileUpload(event,'image')">
    <input type="file" id="textFileInput" accept=".txt,.md,.json,.csv" class="hidden-input" onchange="handleFileUpload(event,'text')">

    <div class="subject-bar">
      <div class="subject-scroll" id="subjectList"></div>
      <button class="edit-btn" id="editToggleBtn" onclick="toggleEditMode()">编辑目录</button>
    </div>

    <div class="edit-banner" id="editBanner">
      编辑模式：点击条目右侧「管理」，可添加子级、同级，重命名、排序或删除。
      <div class="eb-actions">
        <button class="primary" onclick="openAddDialog(null,'root')">添加一级目录</button>
        <button onclick="resetSubject()">恢复本科目默认</button>
      </div>
    </div>

    <div class="meta-row">
      <span id="metaText"></span>
      <span class="links"><button onclick="expandAll(true)">全部展开</button><i>|</i><button onclick="expandAll(false)">全部收起</button></span>
    </div>
    <div id="catalogList"></div>
  </div>

  <!-- 卡片 -->
  <div class="content" id="tab-favorites">
    <div class="fav-bar" id="favBar"><span>共 <b id="favTotal">0</b> 张，左右滑动翻页</span><span><b id="favIdx">1</b> / <span id="favMax">1</span></span></div>
    <div class="flashcard-container" id="favoritesContainer"></div>
  </div>

  <!-- 设置 -->
  <div class="content" id="tab-settings">
    <div class="card-box">
      <div class="stats-row"><span>API 调用次数</span><span class="stats-val" id="stat-api-calls">0</span></div>
      <div class="stats-row"><span>估算 Token 量</span><span class="stats-val" id="stat-tokens">0</span></div>
      <div class="stats-row"><span>目录点击总次数</span><span class="stats-val" id="stat-clicks">0</span></div>
    </div>

    <div class="set-title">阅读字号</div>
    <div class="seg" id="fontSeg">
      <button onclick="setFontStep(0)">小</button>
      <button onclick="setFontStep(1)">标准</button>
      <button onclick="setFontStep(2)">大</button>
      <button onclick="setFontStep(3)">特大</button>
    </div>
    <div class="preview"><div class="md"><h3>字号预览</h3><p>法律关系由<strong>主体、客体、内容</strong>三个要素构成。</p></div></div>

    <div class="set-title">DeepSeek API Key（仅保存在本机）</div>
    <input type="password" class="set-input" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
    <button class="btn-block" onclick="saveApiKey()">保存 API Key</button>

    <div class="set-title">数据</div>
    <button class="btn-outline" onclick="exportData()">导出数据备份</button>
    <button class="btn-outline gray" onclick="document.getElementById('importFile').click()">导入数据恢复</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('query')">查询</div>
    <div class="nav-item" onclick="switchTab('favorites')">卡片</div>
    <div class="nav-item" onclick="switchTab('settings')">设置</div>
  </div>
</div>

<!-- 通用弹层：操作菜单、编辑框、确认框 -->
<div class="layer" id="layer"><div class="sheet" id="sheet"></div></div>

<!-- 阅读器 -->
<div class="layer" id="reader" style="z-index:150">
  <div class="reader" id="rdSheet">
    <div class="rd-head">
      <div class="rd-titles">
        <div class="rd-title" id="rdTitle" onclick="tripleTap('rd',toggleFull)"></div>
        <div class="rd-sub" id="rdSub"></div>
      </div>
      <div class="rd-tools">
        <button id="rdFullBtn" onclick="toggleFull()">全屏</button>
        <button onclick="closeReader()">关闭</button>
      </div>
    </div>
    <div class="rd-body md" id="rdBody"></div>
    <div class="rd-foot">

/* ====================== 工具函数 ====================== */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let _uid=0;
function genId(){return 'n'+Date.now().toString(36)+(_uid++).toString(36)+Math.random().toString(36).slice(2,5);}
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('本地存储空间不足，数据可能未保存');}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000);}

/* 把缩进文本解析成树：行首每 2 个空格（或 1 个 Tab）为一级 */
function parseOutline(text){
  const root=[];
  const stack=[{level:-1,list:root,node:null}];
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  let count=0;
  for(const raw of lines){
    if(!raw.trim())continue;
    const indent=raw.match(/^[ \t]*/)[0].replace(/\t/g,'  ').length;
    const want=Math.min(Math.floor(indent/2),5);
    const title=raw.trim().replace(/^[-•*·]\s+/,'').slice(0,60);
    if(!title)continue;
    while(stack.length>1&&stack[stack.length-1].level>=want)stack.pop();
    const parent=stack[stack.length-1];
    const node={id:genId(),title};
    if(parent.node){(parent.node.children=parent.node.children||[]).push(node);}
    else parent.list.push(node);
    stack.push({level:parent.level+1,node});
    if(++count>400)break;
  }
  return root;
}
function countAll(nodes){let c=0;for(const n of nodes){c++;if(n.children)c+=countAll(n.children);}return c;}
function countLeaves(nodes){let c=0;for(const n of nodes||[]){if(n.children&&n.children.length)c+=countLeaves(n.children);else c++;}return c;}
function locate(list,id,path){path=path||[];for(let i=0;i<list.length;i++){const n=list[i];const p=path.concat(n.title);if(n.id===id)return{node:n,list,index:i,path:p};if(n.children){const r=locate(n.children,id,p);if(r)return r;}}return null;}
function normalizeTree(nodes){
  if(!Array.isArray(nodes))return[];
  return nodes.filter(n=>n&&typeof n.title==='string').map(n=>{
    const o={id:typeof n.id==='string'?n.id:genId(),title:n.title.slice(0,60)};
    if(Number.isFinite(n.hits)&&n.hits>0)o.hits=Math.floor(n.hits);
    if(Array.isArray(n.children)&&n.children.length)o.children=normalizeTree(n.children);
    return o;
  });
}
function buildDefaults(){const r={};SUBJECTS.forEach(s=>r[s]=parseOutline(DEFAULT_OUTLINES[s]));return r;}
function loadTree(){
  const d=lsGet(TREE_KEY,null);
  if(d&&typeof d==='object'){SUBJECTS.forEach(s=>{d[s]=normalizeTree(d[s]);});return d;}
  return buildDefaults();
}

/* 按句号切分一段 HTML（只在标签外层、句号处切，保证标签不被拆散） */
function splitSentences(html){
  const out=[];let buf='',depth=0,i=0;const n=html.length;
  while(i<n){
    const ch=html[i];
    if(ch==='<'){
      const j=html.indexOf('>',i);
      if(j<0){buf+=html.slice(i);break;}
      const tag=html.slice(i,j+1);buf+=tag;
      const m=tag.match(/^<(\/?)([a-zA-Z0-9]+)/);
      if(m&&!/^(br|hr|img|wbr)$/i.test(m[2])&&!/\/>$/.test(tag))depth+=m[1]?-1:1;
      i=j+1;continue;
    }
    buf+=ch;i++;
    if(ch==='。'&&depth<=0){
      while(i<n&&/[。”’」』）)]/.test(html[i])){buf+=html[i];i++;}
      out.push(buf);buf='';
    }
  }
  if(buf)out.push(buf);
  return out
    .map(s=>s.replace(/^(\s|<br\s*\/?>)+/i,'').replace(/(\s|<br\s*\/?>)+$/i,''))
    .filter(s=>s&&s.replace(/<[^>]*>/g,'').trim());
}
function paragraphize(root){
  root.querySelectorAll('p').forEach(p=>{
    const parts=splitSentences(p.innerHTML);
    if(parts.length<2)return;
    const frag=document.createDocumentFragment();
    parts.forEach(h=>{const np=document.createElement('p');np.innerHTML=h;frag.appendChild(np);});
    p.replaceWith(frag);
  });
  root.querySelectorAll('li').forEach(li=>{
    if(li.querySelector(':scope > p, :scope > ul, :scope > ol, :scope > blockquote'))return;
    const parts=splitSentences(li.innerHTML);
    if(parts.length<2)return;
    li.innerHTML=parts.map(h=>'<span class="sent">'+h+'</span>').join('');
  });
}
function safeMd(text){
  let html;
  try{html=window.marked?marked.parse(text||''):esc(text||'').replace(/\n/g,'<br>');}catch(e){html=esc(text||'');}
  const t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,iframe,object,embed,style,link').forEach(e=>e.remove());
  t.content.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{
    if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))e.removeAttribute(a.name);
  });});
  paragraphize(t.content);
  return t.innerHTML;
}

/* ====================== 状态栏颜色同步 ====================== */
const THEME_LIGHT='#ffffff';
const THEME_DIM='#8d9290';    /* 白色叠加 rgba(18,28,24,.48) 遮罩后的颜色（通用弹窗） */
const THEME_READER='#e4e9e6'; /* 半屏阅读器的不透明底色，与 #reader 背景一致 */
function syncThemeColor(){
  const readerOpen=$('reader').classList.contains('show');
  const layerOpen=$('layer').classList.contains('show');
  let c=THEME_LIGHT;
  if(layerOpen)c=THEME_DIM;
  else if(readerOpen)c=readerFull?THEME_LIGHT:THEME_READER;
  /* 重建 meta，确保系统状态栏即时刷新 */
  const old=document.querySelector('meta[name="theme-color"]');
  const m=document.createElement('meta');m.name='theme-color';m.content=c;m.id='themeColorMeta';
  if(old)old.replaceWith(m);else document.head.appendChild(m);
  /* 页面底色同步，供 iOS 按页面顶部取色 */
  const bg=(c===THEME_LIGHT)?'':c;
  document.documentElement.style.background=bg;
  document.body.style.background=bg;
}

  $('subjectList').innerHTML=SUBJECTS.map(s=>`<button class="subject-btn${s===currentSubject?' active':''}" data-sub="${s}">${s}</button>`).join('');
}
$('subjectList').addEventListener('click',e=>{
  const b=e.target.closest('[data-sub]');if(!b)return;
  currentSubject=b.dataset.sub;lsSet('fs_subject',currentSubject);
  renderSubjects();renderCatalog();
});

function matchNode(n,q){
  if(!q)return true;
  if(n.title.toLowerCase().includes(q.toLowerCase()))return true;
  return (n.children||[]).some(c=>matchNode(c,q));
}
function hl(title,q){
  if(!q)return esc(title);
  const i=title.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(title);
  return esc(title.slice(0,i))+'<mark>'+esc(title.slice(i,i+q.length))+'</mark>'+esc(title.slice(i+q.length));
}
function buildTree(nodes,level,q){
  return nodes.filter(n=>matchNode(n,q)).map(n=>{
    const has=n.children&&n.children.length;
    const t=hl(n.title,q);
    const mgr=isEditMode?`<button class="mgr" data-act="manage" data-id="${n.id}">管理</button>`:'';
    if(!has){
      const h=n.hits|0;
      return `<div class="leaf"><div class="leaf-main" data-act="${isEditMode?'manage':'ask'}" data-id="${n.id}"><span class="leaf-t">${t}</span><span class="hit${h?' on':''}" title="点击次数">${h}</span></div>${mgr}</div>`;
    }
    const selfHit=q&&n.title.toLowerCase().includes(q.toLowerCase());
    const open=q?true:expanded.has(n.id);
    return `<div class="node lv${Math.min(level,4)}${open?' open':''}" data-nid="${n.id}">
      <div class="node-head"><div class="node-main" data-act="toggle" data-id="${n.id}"><span class="chev"></span><span class="node-title">${t}</span><span class="cnt">${countLeaves(n.children)}</span></div>${mgr}</div>
      <div class="node-body">${buildTree(n.children,level+1,selfHit?'':q)}</div></div>`;
  }).join('');
}
function renderCatalog(){
  const list=appData[currentSubject]||[];
  const q=filterText.trim();
  $('metaText').textContent=`${currentSubject} · ${countLeaves(list)} 个知识点`;
  const box=$('catalogList');
  if(!list.length){
    box.innerHTML='<div class="empty">本科目暂无目录<br>点击右上角「编辑目录」，即可创建你自己的章节</div>';
    return;
  }
  box.innerHTML=buildTree(list,1,q)||'<div class="empty">没有匹配的目录条目<br>按回车可直接询问 AI</div>';
}
function bumpHit(node,el){
  node.hits=(node.hits|0)+1;
  saveTree();
  const b=el&&el.querySelector('.hit');
  if(b){b.textContent=node.hits;b.classList.add('on');}
}
$('catalogList').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=el.dataset.id,act=el.dataset.act;
  if(act==='toggle'){
    const node=el.closest('.node');const open=!node.classList.contains('open');
    node.classList.toggle('open',open);
    if(open)expanded.add(id);else expanded.delete(id);
  }else if(act==='ask'){
    const loc=locate(appData[currentSubject],id);
    if(loc){
      bumpHit(loc.node,el);
      queryAI(loc.node.title,{subject:currentSubject,path:loc.path.slice(0,-1).join(' / ')});
    }
  }else if(act==='manage'){
    openManage(id);
  }
});
function expandAll(open){
  if(open){(function walk(ns){ns.forEach(n=>{if(n.children&&n.children.length){expanded.add(n.id);walk(n.children);}});})(appData[currentSubject]);}
  else expanded.clear();
  renderCatalog();
}
$('searchInput').addEventListener('input',e=>{filterText=e.target.value;renderCatalog();});
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();triggerAsk();}});
function triggerAsk(){
  const input=$('searchInput');const val=input.value.trim();
  if(!val){toast('请先输入要提问的内容');return;}
  input.blur();
  queryAI(val,{subject:currentSubject,path:''});
  input.value='';filterText='';renderCatalog();
}

/* ====================== 目录编辑 ====================== */
function toggleEditMode(){
  isEditMode=!isEditMode;
  $('editToggleBtn').classList.toggle('active',isEditMode);
  $('editToggleBtn').textContent=isEditMode?'完成':'编辑目录';
  $('editBanner').classList.toggle('show',isEditMode);
  if(!isEditMode)saveTree();
  renderCatalog();
}
function openManage(id){
  const loc=locate(appData[currentSubject],id);if(!loc)return;
  const parentPath=loc.path.slice(0,-1).join(' / ')||'一级目录';
  openActions(loc.node.title,'位置：'+parentPath,[
    {label:'在其下添加子级',desc:'可一次添加多条，缩进即可建立多级',fn:()=>openAddDialog(id,'child')},
    {label:'在其后添加同级',desc:'插入到该条目的下方',fn:()=>openAddDialog(id,'sibling')},
    {label:'重命名',fn:()=>openRename(id)},
    {label:'上移',disabled:loc.index===0,fn:()=>moveNode(id,-1)},
    {label:'下移',disabled:loc.index===loc.list.length-1,fn:()=>moveNode(id,1)},
    {label:'删除',desc:loc.node.children&&loc.node.children.length?'将同时删除其下所有子级':'',danger:true,fn:()=>confirmDelete(id)}
  ]);
}
function openAddDialog(refId,mode){
  const loc=refId?locate(appData[currentSubject],refId):null;
  let title,desc;
  if(mode==='root'||!loc){mode='root';title='添加一级目录';desc='添加到「'+currentSubject+'」的最前级';}
  else if(mode==='child'){title='添加子级';desc='添加到「'+esc(loc.node.title)+'」之下';}
  else{title='添加同级';desc='插入到「'+esc(loc.node.title)+'」之后';}
  desc+='<div class="hint-box">每行一个条目；行首空 2 格表示下一级。\n例：\n第三编 新增篇章\n  第一章 新增章节\n    知识点 A\n    知识点 B</div>';
  openEditor({title,desc,multiline:true,placeholder:'在此输入，一行一个条目',okText:'添加',onOk:text=>{
    const nodes=parseOutline(text);
    if(!nodes.length){toast('请输入至少一个条目名称');return false;}
    const n=countAll(nodes);
    if(mode==='root'){appData[currentSubject].push(...nodes);}
    else if(mode==='child'){loc.node.children=loc.node.children||[];loc.node.children.push(...nodes);expanded.add(loc.node.id);}
    else{loc.list.splice(loc.index+1,0,...nodes);}
    saveTree();renderCatalog();toast('已添加 '+n+' 个条目');
  }});
}
function openRename(id){
  const loc=locate(appData[currentSubject],id);if(!loc)return;
  openEditor({title:'重命名',desc:'',value:loc.node.title,placeholder:'输入新名称',okText:'保存',onOk:v=>{
    v=v.trim();if(!v){toast('名称不能为空');return false;}
    loc.node.title=v.slice(0,60);saveTree();renderCatalog();
  }});
}
function moveNode(id,dir){
  const loc=locate(appData[currentSubject],id);if(!loc)return;
  const j=loc.index+dir;if(j<0||j>=loc.list.length)return;
  [loc.list[loc.index],loc.list[j]]=[loc.list[j],loc.list[loc.index]];
  saveTree();renderCatalog();
}
function confirmDelete(id){
  const loc=locate(appData[currentSubject],id);if(!loc)return;
  const sub=loc.node.children&&loc.node.children.length?`（含 ${countAll(loc.node.children)} 个子条目）`:'';
  openConfirm(`确定删除「${loc.node.title}」${sub}吗？此操作不可撤销。`,'删除',()=>{
    loc.list.splice(loc.index,1);saveTree();renderCatalog();toast('已删除');
  },true);
}
function resetSubject(){
  openConfirm(`将「${currentSubject}」的目录恢复为内置默认目录？你在本科目下做的修改（包括点击次数）会被覆盖。`,'恢复',()=>{
    appData[currentSubject]=parseOutline(DEFAULT_OUTLINES[currentSubject]);
    expanded.clear();saveTree();renderCatalog();toast('已恢复默认目录');
  },true);
}

let sheetFns=[];let editorCb=null;
function openLayer(html,center){const l=$('layer');l.className='layer show'+(center?' center':'');$('sheet').innerHTML=html;syncThemeColor();}
function closeLayer(){$('layer').className='layer';sheetFns=[];syncThemeColor();}
$('layer').addEventListener('click',e=>{if(e.target.id==='layer')closeLayer();});
function sheetBtn(i){const f=sheetFns[i];closeLayer();if(f)f();}
function openActions(title,sub,items){
  sheetFns=items.map(i=>i.fn);
  openLayer(`<div class="sh-title">${esc(title)}</div>${sub?`<div class="sh-desc">${esc(sub)}</div>`:''}
  <div class="sh-list">${items.map((it,i)=>`<button class="sh-item${it.danger?' danger':''}"${it.disabled?' disabled':''} onclick="sheetBtn(${i})"><span>${esc(it.label)}</span>${it.desc?`<small>${esc(it.desc)}</small>`:''}</button>`).join('')}</div>
  <button class="sh-cancel" onclick="closeLayer()">取消</button>`,false);
}
function openConfirm(msg,okText,fn,danger){
  sheetFns=[fn];
  openLayer(`<div class="sh-title">请确认</div><div class="sh-desc" style="font-size:15.5px;color:var(--text-2)">${esc(msg)}</div>
  <div class="sh-btns"><button class="btn ghost" onclick="closeLayer()">取消</button><button class="btn${danger?' danger':''}" onclick="sheetBtn(0)">${esc(okText)}</button></div>`,true);
}
function openEditor(o){
  editorCb=o.onOk;
  const field=o.multiline
    ?`<textarea id="edField" rows="8" placeholder="${esc(o.placeholder||'')}">${esc(o.value||'')}</textarea>`
    :`<input id="edField" type="text" maxlength="60" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}">`;
  openLayer(`<div class="sh-title">${esc(o.title)}</div>${o.desc?`<div class="sh-desc">${o.desc}</div>`:''}${field}
  <div class="sh-btns"><button class="btn ghost" onclick="closeLayer()">取消</button><button class="btn" onclick="submitEditor()">${esc(o.okText||'确定')}</button></div>`,true);
  setTimeout(()=>{const f=$('edField');if(f){f.focus();if(!o.multiline)f.select();}},80);
}
function submitEditor(){
  const v=$('edField').value;const cb=editorCb;
  if(cb&&cb(v)===false)return;
  closeLayer();
}

/* ====================== AI ====================== */
function systemPrompt(subject){
return `你是资深法律硕士（法硕）考研辅导老师，当前科目：${subject}。请针对用户给出的知识点，严格按下列 Markdown 结构输出，语言精炼、条理清晰，不要客套话和开场白：

### 定义
用 1–3 句话给出精准概念，关键术语用 **加粗**。

### 理解
用通俗语言拆解原理，必要时举一个简短例子。

### 考点
分点列出常考点、易混淆点（每点一行，以“- ”开头）。

### 法条与核心表述
引用现行有效法条（注明法律名称与条号），使用 > 引用格式；政治科目给出教材标准表述。

要求：以现行法律为准（如《民法典》、《刑法》及其修正案、现行《刑事诉讼法》《民事诉讼法》），不得编造条文；无法确定条号时注明“请以最新法条核对”。`;
}
async function callAI(messages){
  const resp=await fetch('https://api.deepseek.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.3})
  });
  let data=null;try{data=await resp.json();}catch(e){}
  if(!resp.ok||!data||!data.choices||!data.choices.length){
    throw new Error((data&&data.error&&data.error.message)||('HTTP '+resp.status));
  }
  return{content:data.choices[0].message.content,tokens:(data.usage&&data.usage.total_tokens)||0};
}
function showLoading(title,sub){
  currentAI={title,content:'',subject:currentSubject,path:sub||''};
  showReader({title,sub:sub||currentSubject,html:'<div class="loading">正在生成解析</div>',canFav:true,full:false});
  setFavState(false,false);
}
function showNoKey(){
  $('rdBody').innerHTML='<div class="notice">尚未配置 API Key。<br>请先到「设置」页填写 DeepSeek API Key。<br><button class="btn" onclick="closeReader();switchTab(\'settings\')">前往设置</button></div>';
}
async function queryAI(keyword,ctx){
  if(isEditMode)return;
  ctx=ctx||{};
  stats.clicks++;saveStats();
  const subject=ctx.subject||currentSubject;
  showLoading(keyword,ctx.path?ctx.subject+' / '+ctx.path:subject);
  currentAI.subject=subject;currentAI.path=ctx.path||'';
  if(!apiKey){showNoKey();return;}
  const seq=++reqSeq;
  try{
    const user=ctx.path?`知识点：${keyword}\n所属目录：${subject} / ${ctx.path}`:keyword;
    const r=await callAI([{role:'system',content:systemPrompt(subject)},{role:'user',content:user}]);
    if(seq!==reqSeq)return;
    currentAI.content=r.content;
    $('rdBody').innerHTML=safeMd(r.content);
    stats.apiCalls++;stats.tokens+=r.tokens||(keyword.length+r.content.length);saveStats();
    setFavState(true,false);
  }catch(err){
    if(seq!==reqSeq)return;
    $('rdBody').innerHTML=`<div class="err">请求失败：${esc(err.message)}</div>`;
  }
}
function handleFileUpload(event,type){
  const file=event.target.files[0];if(!file)return;
  const label=type==='image'?'图像解析':'文档解析';
  showLoading(label,file.name);
  const seq=++reqSeq;
  const reader=new FileReader();
  reader.onload=async e=>{
    if(!apiKey){showNoKey();return;}
    try{
      let messages;
      if(type==='text'){
        const text=String(e.target.result).slice(0,6000);
        messages=[{role:'system',content:systemPrompt(currentSubject)},{role:'user',content:'请解析以下内容中的知识点：\n'+text}];
      }else{
        messages=[{role:'user',content:[{type:'text',text:systemPrompt(currentSubject)+'\n\n请识别图片中的知识点并按上述结构输出。'},{type:'image_url',image_url:{url:e.target.result}}]}];
      }
      const r=await callAI(messages);
      if(seq!==reqSeq)return;
      currentAI.content=r.content;
      $('rdBody').innerHTML=safeMd(r.content);
      stats.apiCalls++;stats.tokens+=r.tokens||(type==='image'?1000:r.content.length);saveStats();
      setFavState(true,false);
    }catch(err){
      if(seq!==reqSeq)return;
      $('rdBody').innerHTML=`<div class="err">请求失败：${esc(err.message)}${type==='image'?'<br>当前模型可能不支持图片识别，建议改为上传文本文件。':''}</div>`;
    }
  };
  if(type==='text')reader.readAsText(file);else reader.readAsDataURL(file);
  event.target.value='';
}

/* ====================== 阅读器 ====================== */
function showReader(o){
  $('rdTitle').textContent=o.title;
  $('rdSub').textContent=o.sub||'';$('rdSub').style.display=o.sub?'block':'none';
  $('rdBody').innerHTML=o.html;$('rdBody').scrollTop=0;
  $('rdFav').style.display=o.canFav?'':'none';
  $('reader').classList.add('show');
  setFull(!!o.full);
}
function closeReader(){reqSeq++;$('reader').classList.remove('show');syncThemeColor();}
function setFull(b){
  readerFull=b;
  $('rdSheet').classList.toggle('full',b);
  $('reader').classList.toggle('full-bg',b);
  $('rdFullBtn').textContent=b?'退出全屏':'全屏';
  syncThemeColor();
}
function toggleFull(){setFull(!readerFull);}
function setFavState(enabled,done){
  const b=$('rdFav');b.disabled=!enabled;b.textContent=done?'已收藏':'收藏为卡片';
}
function addToFavorites(){
  if(!currentAI.title||!currentAI.content)return;
  const sub=currentAI.subject;
  const idx=favorites.findIndex(f=>f.title===currentAI.title&&f.subject===sub);
  const item={id:Date.now(),title:currentAI.title,subject:sub,content:currentAI.content,
    time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};
  if(idx>=0)favorites.splice(idx,1);
  favorites.push(item);saveFavorites();
  setFavState(true,true);toast(idx>=0?'已更新卡片':'已收藏至卡片');
}
let tapCount=0,tapTimer=null;
function tripleTap(key,fn){
  tapCount++;clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{tapCount=0;},600);
  if(tapCount>=3){tapCount=0;fn();}
}

/* ====================== 阅读字号 ====================== */
function applyFont(){
  fontStep=Math.max(0,Math.min(3,fontStep|0));
  document.documentElement.style.setProperty('--read',FONT_SIZES[fontStep]+'px');
  [...$('fontSeg').children].forEach((b,i)=>b.classList.toggle('active',i===fontStep));
}
function setFontStep(i){fontStep=i;lsSet('fs_font',fontStep);applyFont();}
function stepFont(d){
  const n=Math.max(0,Math.min(3,fontStep+d));
  if(n===fontStep){toast(d>0?'已是最大字号':'已是最小字号');return;}
  setFontStep(n);
}

/* ====================== 卡片 ====================== */
function renderFavorites(){
  const box=$('favoritesContainer');const bar=$('favBar');
  if(!favorites.length){
    bar.style.display='none';
    box.innerHTML='<div class="empty-fav">还没有卡片<br>在「查询」页点开知识点，收藏后会出现在这里</div>';
    return;
  }
  bar.style.display='flex';
  const list=[...favorites].reverse();
  box.innerHTML=list.map(f=>`<article class="flashcard" data-fid="${f.id}">
    <div class="fc-head"><div class="fc-title">${esc(f.title)}</div>${f.subject?`<span class="tag">${esc(f.subject)}</span>`:''}</div>
    <div class="fc-body md">${safeMd(f.content)}</div>
    <div class="fc-foot"><span>${esc(f.time)}</span><span><button data-act="fc-full" data-fid="${f.id}">全屏阅读</button><button class="danger" data-act="fc-del" data-fid="${f.id}">删除</button></span></div>
  </article>`).join('');
  $('favTotal').textContent=list.length;$('favMax').textContent=list.length;
  box.scrollLeft=0;updateFavCounter();
}
function updateFavCounter(){
  const box=$('favoritesContainer');const first=box.querySelector('.flashcard');if(!first)return;
  const step=first.offsetWidth+12;
  $('favIdx').textContent=Math.min(favorites.length,Math.max(1,Math.round(box.scrollLeft/step)+1));
}
$('favoritesContainer').addEventListener('scroll',updateFavCounter,{passive:true});
$('favoritesContainer').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=Number(b.dataset.fid);const f=favorites.find(x=>x.id===id);if(!f)return;
  if(b.dataset.act==='fc-full'){
    currentAI={title:'',content:'',subject:'',path:''};
    showReader({title:f.title,sub:f.subject,html:safeMd(f.content),canFav:false,full:true});
  }else if(b.dataset.act==='fc-del'){
    openConfirm(`确定删除卡片「${f.title}」吗？`,'删除',()=>{
      favorites=favorites.filter(x=>x.id!==id);saveFavorites();renderFavorites();toast('已删除');
    },true);
  }
});

/* ====================== 标签切换 ====================== */
function switchTab(tab){
  document.querySelectorAll('.content').forEach(el=>el.classList.remove('active'));
  $('tab-'+tab).classList.add('active');
  const order=['query','favorites','settings'];
  document.querySelectorAll('.nav-item').forEach((el,i)=>el.classList.toggle('active',order[i]===tab));
  if(tab==='favorites'){renderFavorites();}
  if(tab==='settings')updateStatsUI();
}

/* ====================== 划词查询 ====================== */
const selBtn=$('selectionBtn');let selTimer=null;
function hideSel(){selBtn.style.display='none';}
function handleSelection(){
  const sel=window.getSelection();
  const text=sel?sel.toString().trim():'';
  if(!text||text.length>60||!sel.rangeCount){hideSel();return;}
  const an=sel.anchorNode;const el=an&&(an.nodeType===1?an:an.parentElement);
  if(!el||el.closest('input,textarea,.selection-btn,#layer')){hideSel();return;}
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  if(!rect.width&&!rect.height){hideSel();return;}
  let x=rect.left+rect.width/2;x=Math.max(50,Math.min(window.innerWidth-50,x));
  let y=rect.top-12;let below=false;
  if(y<56){y=rect.bottom+14;below=true;}
  selBtn.style.left=x+'px';selBtn.style.top=y+'px';
  selBtn.classList.toggle('below',below);
  selBtn.style.display='block';selBtn.dataset.text=text;
}
document.addEventListener('selectionchange',()=>{clearTimeout(selTimer);selTimer=setTimeout(handleSelection,220);});
function querySelection(){
  const text=selBtn.dataset.text;
  if(text){
    const s=window.getSelection();if(s)s.removeAllRanges();
    hideSel();
    queryAI(text,{subject:currentAI.subject||currentSubject,path:''});
  }
}

function exportData(){
  const data={version:2,treeData:appData,favorites,stats,exportTime:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='fashuo_backup_'+Date.now()+'.json';a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data||(!data.treeData&&!Array.isArray(data.favorites)))throw new Error('format');
      if(data.treeData&&typeof data.treeData==='object'){
        SUBJECTS.forEach(s=>{appData[s]=normalizeTree(data.treeData[s]);});
        saveTree();expanded.clear();renderCatalog();
      }
      if(Array.isArray(data.favorites)){favorites=data.favorites;saveFavorites();renderFavorites();}
      if(data.stats&&typeof data.stats==='object'){stats=Object.assign({apiCalls:0,tokens:0,clicks:0},data.stats);saveStats();}
      toast('数据恢复成功');
    }catch(err){toast('文件格式不正确');}
  };
  reader.readAsText(file);event.target.value='';
}

init();
</script>
