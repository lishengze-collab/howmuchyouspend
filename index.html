<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>法硕记忆助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2c5e4f;
            --primary-light: #f0f5f3;
            --bg-color: #fafafa;
            --text-main: #222222;
            --text-muted: #999999;
            --white: #ffffff;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px 10px;
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            letter-spacing: 1px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 90px 20px;
            display: none;
        }
        .content.active { display: block; }

        /* 搜索框容器 (包含图标) */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 14px 45px 14px 45px; /* 留出左右图标的位置 */
            border-radius: 30px;
            border: none;
            background-color: var(--bg-color);
            font-size: 15px;
            outline: none;
            transition: background 0.2s;
        }
        .search-box:focus { background-color: #eeeeee; }
        
        .icon-search, .icon-add {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            height: 100%;
            width: 45px;
        }
        .icon-search { left: 0; }
        .icon-add { right: 0; color: var(--primary); }

        /* 科目滚动 */
        .subject-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .subject-scroll::-webkit-scrollbar { display: none; }
        
        .subject-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: var(--bg-color);
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.2s;
        }
        .subject-btn.active {
            background: var(--primary);
            color: var(--white);
            font-weight: 500;
        }

        /* 多级手风琴目录 */
        .tree-group { border-bottom: none; }
        .tree-title {
            padding: 14px 5px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            border-bottom: 1px solid #f0f0f0;
        }
        .tree-title.level-1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            border-bottom: none;
            padding: 18px 5px 10px 5px;
        }
        .tree-title.level-2 { padding-left: 15px; font-weight: 600; }
        .tree-title.level-3 { padding-left: 30px; color: #555; }
        
        .tree-title .arrow {
            transition: transform 0.3s;
            color: #ccc;
            font-size: 18px;
            padding-right: 5px;
        }
        .tree-title.active .arrow { transform: rotate(90deg); }
        
        .tree-children {
            display: none;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .tree-children.show { display: block; animation: fadeIn 0.3s ease; }
        
        .knowledge-item {
            padding: 12px 15px 12px 35px;
            font-size: 14px;
            color: #444;
            border-bottom: 1px solid #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .knowledge-item:last-child { border-bottom: none; }
        .knowledge-item::before {
            content: '•';
            color: var(--primary);
            margin-right: 8px;
            font-weight: bold;
        }
        .knowledge-item:active { background-color: #e8eceb; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 56px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.03);
            z-index: 20;
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 15px;
            flex: 1;
            text-align: center;
            height: 100%;
            line-height: 56px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }

        /* 弹窗 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            max-height: 85vh;
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            animation: scaleIn 0.25s ease;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }
        .modal-footer { display: flex; justify-content: center; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Markdown 排版 */
        .markdown-body h3 {
            color: var(--primary);
            font-size: 16px;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }
        .markdown-body h3:first-child { margin-top: 0; }
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin-bottom: 15px; }
        .markdown-body li { margin-bottom: 6px; }

        /* Flash Card */
        .flashcard-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 10px 0;
            height: calc(100vh - 160px);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .flashcard-container::-webkit-scrollbar { display: none; }
        .flashcard {
            flex: 0 0 88%;
            scroll-snap-align: center;
            background: var(--bg-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            flex: 1;
            padding-right: 10px;
        }
        .delete-btn {
            color: #ff4d4f;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #444;
        }
        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 设置页 */
        .stats-box {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .stats-val { font-weight: 600; color: var(--primary); }
        .setting-item { margin-bottom: 20px; }
        .setting-item label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .setting-item input {
            width: 100%;
            padding: 14px;
            border: 1px solid #eee;
            background: var(--bg-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: var(--white);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 12px;
            font-size: 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        .empty-state {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            margin-top: 100px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header" id="header-title">记忆助手</div>
    
    <!-- TAB 1: 查询 -->
    <div class="content active" id="tab-query">
        <!-- 搜索框改造，加入图标 -->
        <div class="search-container">
            <div class="icon-search" onclick="triggerSearch()">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="搜索知识点或直接询问AI...">
            <div class="icon-add" onclick="document.getElementById('imageInput').click()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
        </div>
        <!-- 隐藏的图像输入框 -->
        <input type="file" id="imageInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageUpload(event)">
        
        <div class="subject-scroll" id="subjectList"></div>

        <div id="catalogList"></div>
    </div>

    <!-- TAB 2: 收藏 -->
    <div class="content" id="tab-favorites" style="padding: 0 10px 90px 10px;">
        <div class="flashcard-container" id="favoritesContainer"></div>
    </div>

    <!-- TAB 3: 设置 -->
    <div class="content" id="tab-settings">
        <div class="stats-box">
            <div class="stats-row"><span>API 调用次数</span> <span class="stats-val" id="stat-api-calls">0</span></div>
            <div class="stats-row"><span>估算 TOKEN 量</span> <span class="stats-val" id="stat-tokens">0</span></div>
            <div class="stats-row"><span>目录点击总次数</span> <span class="stats-val" id="stat-clicks">0</span></div>
        </div>

        <div class="setting-item">
            <label>DeepSeek API Key (仅本地存储)</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
        </div>

        <button class="btn-primary" onclick="saveApiKey()">保存 API Key</button>
        
        <div style="margin-top: 40px;">
            <button class="btn-outline" onclick="exportData()">导出数据备份</button>
            <button class="btn-outline" style="border-color: #ddd; color: #666;" onclick="document.getElementById('importFile').click()">导入数据恢复</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('query')">查询</div>
        <div class="nav-item" onclick="switchTab('favorites')">卡片</div>
        <div class="nav-item" onclick="switchTab('settings')">设置</div>
    </div>

    <!-- AI 弹窗 -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">解析</span>
                <span onclick="closeModal()" style="color:#ccc; font-size: 24px; line-height: 1; cursor: pointer;">×</span>
            </div>
            <div class="modal-body markdown-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" id="favBtn" onclick="addToFavorites()">收藏此卡片</button>
            </div>
        </div>
    </div>
</div>

<script>
    marked.setOptions({ breaks: true, gfm: true });

    const subjects = ["刑法", "民法", "法理学", "宪法学", "法制史", "政治", "刑诉法", "民诉法"];
    
    // 精确到4级的树形目录结构
    const knowledgeTree = {
        "刑法": [
            {
                title: "第一编 刑法总则",
                children: [
                    {
                        title: "第一章 绪论",
                        children: [
                            { title: "第一节 刑法概述", items: ["刑法的概念", "刑法的性质", "刑法的任务", "刑法的体系", "刑法的解释（文义、论理、体系、历史解释等）"] },
                            { title: "第二节 刑法的基本原则", items: ["罪刑法定原则", "适用刑法人人平等原则", "罪责刑相适应原则"] },
                            { title: "第三节 刑法的效力", items: ["空间效力（属地、属人、保护、普遍管辖）", "时间效力（从旧兼从轻原则）"] }
                        ]
                    },
                    {
                        title: "第二章 犯罪概念与犯罪构成",
                        children: [
                            { title: "第一节 犯罪概念", items: ["犯罪的形式概念", "犯罪的实质概念", "犯罪的基本特征"] },
                            { title: "第二节 犯罪构成", items: ["犯罪构成的概念", "犯罪构成的分类"] }
                        ]
                    },
                    {
                        title: "第三章 犯罪构成要件",
                        children: [
                            { title: "第一节 犯罪客体", items: ["犯罪客体的概念", "犯罪客体的分类（一般、同类、直接）", "犯罪对象与犯罪客体的区别"] },
                            { title: "第二节 犯罪客观方面", items: ["危害行为（作为与不作为）", "不作为犯的成立条件", "危害结果", "刑法上的因果关系", "犯罪的时间、地点、方法"] },
                            { title: "第三节 犯罪主体", items: ["刑事责任年龄（完全、相对、绝对无责任）", "刑事责任能力（精神病人、醉酒人、生理缺陷者）", "一般主体与特殊主体"] },
                            { title: "第四节 犯罪主观方面", items: ["犯罪故意（直接、间接）", "犯罪过失（疏忽大意、过于自信）", "无罪过事件（意外事件、不可抗力）", "犯罪目的与动机", "认识错误（事实认识错误、法律认识错误）"] }
                        ]
                    },
                    {
                        title: "第四章 故意犯罪的停止形态",
                        children: [
                            { title: "第一节 概述与预备", items: ["犯罪停止形态概述", "犯罪预备的成立条件与处罚"] },
                            { title: "第二节 未遂与中止", items: ["犯罪未遂的特征（着手、未得逞、意志外原因）", "犯罪中止的特征（自动性、有效性）", "未遂与中止的区别"] }
                        ]
                    },
                    {
                        title: "第五章 共同犯罪与罪数",
                        children: [
                            { title: "第一节 共同犯罪", items: ["共同犯罪的成立条件", "主犯、从犯、胁从犯、教唆犯的认定与处罚", "共同犯罪的形式"] },
                            { title: "第二节 罪数形态", items: ["实质的一罪（想象竞合犯、结果加重犯、继续犯）", "法定的一罪（结合犯、集合犯）", "处断的一罪（连续犯、牵连犯、吸收犯）"] }
                        ]
                    },
                    {
                        title: "第六章 刑罚与刑罚制度",
                        children: [
                            { title: "第一节 刑罚概述与量刑", items: ["刑罚的种类（主刑与附加刑）", "量刑情节（法定与酌定、从重从轻减轻免除）", "累犯的成立条件与处罚"] },
                            { title: "第二节 刑罚执行与消灭", items: ["自首与坦白", "立功", "缓刑制度", "减刑制度", "假释制度", "追诉时效"] }
                        ]
                    }
                ]
            },
            {
                title: "第二编 刑法分则",
                children: [
                    {
                        title: "第一章 危害公共安全罪",
                        children: [
                            { title: "第一节 危险方法类犯罪", items: ["放火罪", "决水罪", "爆炸罪", "投放危险物质罪", "以危险方法危害公共安全罪"] },
                            { title: "第二节 交通类犯罪", items: ["交通肇事罪（逃逸致人死亡的认定）", "危险驾驶罪（追逐竞驶、醉驾等）"] }
                        ]
                    },
                    {
                        title: "第二章 侵犯人身权利、财产罪",
                        children: [
                            { title: "第一节 侵犯人身权利罪", items: ["故意杀人罪", "过失致人死亡罪", "故意伤害罪", "强奸罪", "非法拘禁罪", "绑架罪（与抢劫罪界限）"] },
                            { title: "第二节 侵犯财产罪", items: ["抢劫罪（转化型抢劫、加重情节）", "盗窃罪（秘密窃取及新型手段）", "诈骗罪（诈骗与盗窃区分）", "抢夺罪", "侵占罪", "职务侵占罪", "敲诈勒索罪"] }
                        ]
                    },
                    {
                        title: "第三章 贪污贿赂与渎职罪",
                        children: [
                            { title: "第一节 贪污贿赂罪", items: ["贪污罪", "挪用公款罪", "受贿罪", "利用影响力受贿罪", "行贿罪"] },
                            { title: "第二节 渎职罪", items: ["滥用职权罪", "玩忽职守罪", "徇私枉法罪"] }
                        ]
                    }
                ]
            }
        ],
        "民法": [
            {
                title: "第一编 民法总则",
                children: [
                    {
                        title: "第一章 民法基础理论",
                        children: [
                            { title: "第一节 民法概述", items: ["民法的概念与调整对象", "民法的性质与渊源", "民法典的体系"] },
                            { title: "第二节 基本原则", items: ["平等原则", "自愿原则", "公平原则", "诚实信用原则", "公序良俗原则", "绿色原则"] }
                        ]
                    },
                    {
                        title: "第二章 民事法律关系与主体",
                        children: [
                            { title: "第一节 民事法律关系", items: ["民事法律关系的要素", "民事权利的分类（支配权、请求权、抗辩权、形成权）", "民事法律事实"] },
                            { title: "第二节 自然人", items: ["民事权利能力与民事行为能力", "监护制度（设定、变更、撤销）", "宣告失踪与宣告死亡的条件及法律后果"] },
                            { title: "第三节 法人与非法人组织", items: ["法人的分类（营利、非营利、特别法人）", "法人的能力与机关", "非法人组织的类型与责任承担"] }
                        ]
                    },
                    {
                        title: "第三章 民事法律行为与代理",
                        children: [
                            { title: "第一节 民事法律行为", items: ["意思表示的生效与解释", "民事法律行为的效力（有效、无效、可撤销、效力待定）", "附条件与附期限的民事法律行为"] },
                            { title: "第二节 代理", items: ["代理的分类（委托、法定、指定）", "无权代理与表见代理", "间接代理"] },
                            { title: "第三节 诉讼时效", items: ["诉讼时效的适用范围", "诉讼时效的中止、中断与延长", "除斥期间与诉讼时效的区别"] }
                        ]
                    }
                ]
            },
            {
                title: "第二编 物权与合同",
                children: [
                    {

    function renderSubjects() {

    // 递归渲染多级目录
    function buildTreeDOM(nodes, level = 1) {
        return nodes.map(node => {
            if (node.items) {
                // 叶子节点：知识点列表
                return `
                    <div class="leaf-container">
                        ${node.items.map(item => `<div class="knowledge-item" onclick="queryAI('${node.title} - ${item}')">${item}</div>`).join('')}
                    </div>
                `;
            } else {
                // 非叶子节点：可折叠的目录
                const uniqueId = 'node_' + Math.random().toString(36).substr(2, 9);
                return `
                    <div class="tree-group">
                        <div class="tree-title level-${level}" onclick="toggleNode('${uniqueId}', this)">
                            <span>${node.title}</span>
                            <span class="arrow">›</span>
                        </div>
                        <div class="tree-children" id="${uniqueId}">
                            ${buildTreeDOM(node.children, level + 1)}
                        </div>
                    </div>
                `;
            }
        }).join('');
    }

    function renderCatalog(sub) {
        const container = document.getElementById('catalogList');
        const chapters = knowledgeTree[sub] || [];
        
        if(chapters.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">暂无数据，您可以直接在搜索框查询</div>';
            return;
        }

        // 渲染树
        container.innerHTML = buildTreeDOM(chapters, 1);
    }

    // 展开/折叠逻辑
    function toggleNode(id, titleEl) {
        const itemsContainer = document.getElementById(id);
        
        if (itemsContainer.classList.contains('show')) {
            itemsContainer.classList.remove('show');
            titleEl.classList.remove('active');
        } else {
            itemsContainer.classList.add('show');
            titleEl.classList.add('active');
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        
        const navs = document.querySelectorAll('.nav-item');
        if(tabId === 'query') navs[0].classList.add('active');
        if(tabId === 'favorites') navs[1].classList.add('active');
        if(tabId === 'settings') navs[2].classList.add('active');

        const titles = {query: '记忆助手', favorites: '知识卡片', settings: '统计与设置'};
        document.getElementById('header-title').innerText = titles[tabId];

        if(tabId === 'favorites') renderFavorites();
        if(tabId === 'settings') updateStatsUI();
    }

    // 处理图像上传
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;
            
            const modal = document.getElementById('aiModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const favBtn = document.getElementById('favBtn');
            
            modal.classList.add('active');
            modalTitle.innerText = "图像解析";
            modalBody.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">📷 正在识别图片内容并生成解析...</div>';
            favBtn.disabled = true;
            favBtn.style.opacity = '0.5';
            currentAIKeyword = "图像内容解析";
            
            if (!apiKey) {
                setTimeout(() => {
                    currentAIContent = `### 知识点\n图像模拟解析\n\n### 定义\n由于未配置 API Key，无法进行真实的多模态识别。\n\n### 理解\n当前图片已就绪，需配置支持视觉的 API（如兼容 OpenAI 格式的接口）。\n\n### 考点\n图片内通常包含重要知识点或错题。\n\n*(⚠️ 当前为模拟数据)*`;
                    modalBody.innerHTML = marked.parse(currentAIContent);
                    favBtn.disabled = false;
                    favBtn.style.opacity = '1';
                }, 1000);
                return;
            }

            try {
                // 构造多模态请求
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat", // 提示：DeepSeek 的 chat 模型如果无法处理图像，建议换成支持视觉的模型如 gpt-4o 或 qwen-vl
                        messages: [
                            {
                                "role": "user", 
                                "content": [
                                    {"type": "text", "text": "请识别这张图片中的法硕/考研知识点，并严格按照以下Markdown格式输出：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解法理）\n\n### 考点\n（分点罗列）\n\n### 法条详情\n（引用原文）"},
                                    {"type": "image_url", "image_url": {"url": base64}}
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                if(data.choices && data.choices.length > 0) {
                    currentAIContent = data.choices[0].message.content;
                    modalBody.innerHTML = marked.parse(currentAIContent);
                    
                    stats.apiCalls++;
                    stats.tokens += 1000; // 图像估算token
                    saveStats();
                    favBtn.disabled = false;
                    favBtn.style.opacity = '1';
                } else {
                    modalBody.innerHTML = "<span style='color:red'>API 返回异常。可能是当前模型不支持图像输入，请更换模型。</span>";
                }
            } catch (error) {
                modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
            }
            
            // 清空 input 允许重复上传同一张图片
            event.target.value = '';
        };
        reader.readAsDataURL(file);
    }

    async function queryAI(keyword) {
        stats.clicks++;
        saveStats();

        const modal = document.getElementById('aiModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const favBtn = document.getElementById('favBtn');
        
        modal.classList.add('active');
        modalTitle.innerText = keyword;
        modalBody.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">正在生成解析...</div>';
        favBtn.disabled = true;
        favBtn.style.opacity = '0.5';
        currentAIKeyword = keyword;

        if (!apiKey) {
            setTimeout(() => {
                currentAIContent = `### 知识点\n${keyword}\n\n### 定义\n这是关于“${keyword}”的法学/政治核心概念。\n\n### 理解\n具有法定性、强制性。需结合具体语境拆解。\n\n### 考点\n常考简答题、选择题。注意区分相邻概念。\n\n### 法条详情/核心表述\n《XXX》第X条...\n\n*(⚠️ 当前为模拟数据，请在设置中填入API Key)*`;
                modalBody.innerHTML = marked.parse(currentAIContent);
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            }, 600);
            return;
        }

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {"role": "system", "content": "你是法硕考研/考研政治专家。请严格按照以下Markdown格式输出，不要客套话：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解法理或原理）\n\n### 考点\n（分点罗列常考点、易混淆点）\n\n### 法条详情/核心表述\n（引用法条原文或经典表述）"},
                        {"role": "user", "content": keyword}
                    ]
                })
            });

            const data = await response.json();
            if(data.choices && data.choices.length > 0) {
                currentAIContent = data.choices[0].message.content;
                modalBody.innerHTML = marked.parse(currentAIContent);
                
                stats.apiCalls++;
                stats.tokens += Math.floor((keyword.length + currentAIContent.length));
                saveStats();
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            } else {
                modalBody.innerHTML = "<span style='color:red'>API 返回异常。</span>";
            }
        } catch (error) {
            modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
        }
    }

        const container = document.getElementById('favoritesContainer');
        if(favorites.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无卡片，快去查询并收藏吧~</div>';
            return;
        }

        const sortedFavs = [...favorites].reverse();
        
        container.innerHTML = sortedFavs.map(fav => {
            return `
            <div class="flashcard">
                <div class="card-header">
                    <div class="card-title">${fav.title}</div>
                    <button class="delete-btn" onclick="deleteFavorite(${fav.id}, event)">删除</button>
                </div>
                <div class="card-body markdown-body">
                    ${marked.parse(fav.content)}
                </div>
                <div class="card-footer">${fav.time}</div>
            </div>
            `;
        }).join('');
    }

    function deleteFavorite(id, event) {
        event.stopPropagation(); 
        if(confirm('确定删除这张卡片吗？')) {
            favorites = favorites.filter(f => f.id !== id);
            saveFavorites();
            renderFavorites();
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        apiKey = key;
        localStorage.setItem('fs_api_key', key);
        alert('API Key 已保存');
    }

    function updateStatsUI() {
        document.getElementById('stat-api-calls').innerText = stats.apiCalls;
        document.getElementById('stat-tokens').innerText = stats.tokens;
        document.getElementById('stat-clicks').innerText = stats.clicks;
    }

    function saveStats() {
        localStorage.setItem('fs_stats', JSON.stringify(stats));
        updateStatsUI();
    }

    function saveFavorites() {
        localStorage.setItem('fs_favorites', JSON.stringify(favorites));
    }

    function exportData() {
        const data = { favorites, stats, exportTime: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fashuo_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.favorites && data.stats) {
                    favorites = data.favorites;
                    stats = data.stats;
                    saveFavorites();
                    saveStats();
                    renderFavorites();
                    updateStatsUI();
                    alert('数据恢复成功！');
                } else {
                    alert('文件格式不正确');
                }
            } catch (err) {
                alert('读取文件失败');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    // 支持键盘回车搜索
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            triggerSearch();
        }
    });

    init();
</script>
</body>
</html>
