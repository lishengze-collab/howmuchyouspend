<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>法硕记忆助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2c5e4f;
            --primary-light: #f0f5f3;
            --bg-color: #fafafa;
            --text-main: #222222;
            --text-muted: #999999;
            --white: #ffffff;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--white);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px 10px;
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            letter-spacing: 1px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 90px 20px;
            display: none;
        }
        .content.active { display: block; }

        /* 搜索框 */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: none;
            background-color: var(--bg-color);
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            transition: background 0.2s;
        }
        .search-box:focus { background-color: #eeeeee; }

        /* 科目滚动 */
        .subject-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .subject-scroll::-webkit-scrollbar { display: none; }
        
        .subject-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background: var(--bg-color);
            color: var(--text-muted);
            font-size: 14px;
            transition: all 0.2s;
        }
        .subject-btn.active {
            background: var(--primary);
            color: var(--white);
            font-weight: 500;
        }

        /* 折叠目录样式 */
        .chapter-group {
            border-bottom: 1px solid #f0f0f0;
        }
        .chapter-title {
            padding: 18px 5px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
        }
        .chapter-title .arrow {
            transition: transform 0.3s;
            color: #ccc;
            font-size: 18px;
        }
        .chapter-title.active .arrow {
            transform: rotate(90deg);
        }
        .chapter-items {
            display: none; /* 默认折叠 */
            background: var(--bg-color);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        /* 显示状态 */
        .chapter-items.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .knowledge-item {
            padding: 14px 5px;
            font-size: 14px;
            color: #444;
            border-bottom: 1px dashed #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .knowledge-item:last-child { border-bottom: none; }
        .knowledge-item::before {
            content: '•';
            color: var(--primary);
            margin-right: 8px;
            font-weight: bold;
        }
        .knowledge-item:active { color: var(--primary); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部导航栏 */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 56px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.03);
            z-index: 20;
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 15px;
            flex: 1;
            text-align: center;
            height: 100%;
            line-height: 56px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }

        /* 弹窗 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            max-height: 85vh;
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            animation: scaleIn 0.25s ease;
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }
        .modal-footer { display: flex; justify-content: center; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Markdown 排版 */
        .markdown-body h3 {
            color: var(--primary);
            font-size: 16px;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }
        .markdown-body h3:first-child { margin-top: 0; }
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin-bottom: 15px; }
        .markdown-body li { margin-bottom: 6px; }

        /* Flash Card 收藏容器 */
        .flashcard-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 10px 0;
            height: calc(100vh - 160px);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .flashcard-container::-webkit-scrollbar { display: none; }
        .flashcard {
            flex: 0 0 88%;
            scroll-snap-align: center;
            background: var(--bg-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            flex: 1;
            padding-right: 10px;
        }
        .delete-btn {
            color: #ff4d4f;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #444;
        }
        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 设置页 */
        .stats-box {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .stats-val { font-weight: 600; color: var(--primary); }
        .setting-item { margin-bottom: 20px; }
        .setting-item label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .setting-item input {
            width: 100%;
            padding: 14px;
            border: 1px solid #eee;
            background: var(--bg-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: var(--white);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 12px;
            font-size: 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        .empty-state {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            margin-top: 100px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header" id="header-title">记忆助手</div>
    
    <!-- TAB 1: 查询 -->
    <div class="content active" id="tab-query">
        <input type="text" class="search-box" id="searchInput" placeholder="直接搜索没列出的知识点...">
        
        <div class="subject-scroll" id="subjectList"></div>

        <div id="catalogList"></div>
    </div>

    <!-- TAB 2: 收藏 -->
    <div class="content" id="tab-favorites" style="padding: 0 10px 90px 10px;">
        <div class="flashcard-container" id="favoritesContainer"></div>
    </div>

    <!-- TAB 3: 设置 -->
    <div class="content" id="tab-settings">
        <div class="stats-box">
            <div class="stats-row"><span>API 调用次数</span> <span class="stats-val" id="stat-api-calls">0</span></div>
            <div class="stats-row"><span>估算 TOKEN 量</span> <span class="stats-val" id="stat-tokens">0</span></div>
            <div class="stats-row"><span>目录点击总次数</span> <span class="stats-val" id="stat-clicks">0</span></div>
        </div>

        <div class="setting-item">
            <label>DeepSeek API Key (仅本地存储)</label>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
        </div>

        <button class="btn-primary" onclick="saveApiKey()">保存 API Key</button>
        
        <div style="margin-top: 40px;">
            <button class="btn-outline" onclick="exportData()">导出数据备份</button>
            <button class="btn-outline" style="border-color: #ddd; color: #666;" onclick="document.getElementById('importFile').click()">导入数据恢复</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('query')">查询</div>
        <div class="nav-item" onclick="switchTab('favorites')">卡片</div>
        <div class="nav-item" onclick="switchTab('settings')">设置</div>
    </div>

    <!-- AI 弹窗 -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">解析</span>
                <span onclick="closeModal()" style="color:#ccc; font-size: 24px; line-height: 1; cursor: pointer;">×</span>
            </div>
            <div class="modal-body markdown-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" id="favBtn" onclick="addToFavorites()">收藏此卡片</button>
            </div>
        </div>
    </div>
</div>

<script>
    marked.setOptions({ breaks: true, gfm: true });

    const subjects = ["刑法", "民法", "法理学", "宪法学", "法制史", "政治", "刑诉法", "民诉法"];
    
    // 使用“章节 -> 细分考点”的树形结构
    const knowledgeTree = {

                "联系与发展的基本环节", "社会存在与社会意识", "生产力与生产关系", 
                "经济基础与上层建筑", "社会形态更替", "商品的二因素与劳动的二重性", 
                "剩余价值理论", "资本积累与流通", "垄断资本主义", "社会主义的发展及其规律", 
                "共产主义崇高理想"
            ]},
            { title: "毛泽东思想和中国特色社会主义理论体系", items: [

                "三个代表重要思想", "科学发展观", "习近平新时代中国特色社会主义思想", 
                "五位一体总体布局", "四个全面战略布局"
            ]},
            { title: "中国近现代史纲要", items: [
                "鸦片战争及近代中国社会性质", "太平天国与洋务运动", "戊戌变法与辛亥革命", 
                "新文化运动与五四运动", "中国共产党的成立", "新民主主义革命道路", 
                "社会主义改造", "改革开放历史进程"
            ]},
            { title: "思想道德与法治", items: [
                "人生观与价值观", "理想信念", "中国精神", "社会主义核心价值观", 
                "社会主义道德核心与原则", "法治思维", "宪法法律权威"
            ]}
        ],
        "刑法": [
            { title: "刑法总则", items: [
                "刑法的基本原则", "犯罪的基本特征", "犯罪构成的客观方面", "犯罪构成的主观方面",
                "正当防卫的成立条件", "紧急避险的成立条件", "犯罪预备", "犯罪未遂", "犯罪中止",
                "共同犯罪的成立条件", "主犯与从犯", "继续犯与想象竞合犯", "结果加重犯",
                "累犯的成立条件", "自首与坦白", "立功", "缓刑制度", "减刑制度", "假释制度", "追诉时效"
            ]},
            { title: "刑法分则", items: [
                "交通肇事罪", "危险驾驶罪", "故意杀人罪", "过失致人死亡罪", "强奸罪",
                "非法拘禁罪", "绑架罪", "抢劫罪", "盗窃罪", "诈骗罪", "抢夺罪", "侵占罪",
                "职务侵占罪", "敲诈勒索罪", "妨害公务罪", "寻衅滋事罪", "贪污罪", "受贿罪", "滥用职权罪"
            ]}
        ],
        "民法": [
            { title: "民法总则", items: [
                "民事权利能力与行为能力", "监护制度", "宣告失踪与宣告死亡", "法人的分类",
                "民事法律行为的效力", "无效民事法律行为", "可撤销民事法律行为", "代理权的行使",
                "表见代理", "诉讼时效中止与中断"
            ]},
            { title: "物权与合同", items: [
                "物权法定原则", "动产交付与不动产登记", "善意取得", "共有", 
                "抵押权的设立与效力", "质权", "留置权", "合同的相对性", 
                "要约与承诺", "缔约过失责任", "违约责任", "情势变更原则", 
                "买卖合同风险负担", "赠与合同的撤销", "租赁合同", "借款合同"
            ]},
            { title: "婚姻继承与侵权", items: [
                "无效婚姻与可撤销婚姻", "夫妻共同财产", "法定继承", "遗嘱继承", "代位继承",
                "过错责任原则", "无过错责任原则", "高度危险责任", "饲养动物损害责任"
            ]}
        ],
        "法理学": [
            { title: "法的本体与运行", items: [
                "法的规范作用", "法的社会作用", "法的价值冲突解决原则", "法律规则的分类",
                "法律原则的适用条件", "法的效力冲突规则", "法律关系的主客体", 
                "法律责任的归责原则", "立法体制", "执法与司法的区别", "法律解释的方法"
            ]}
        ],
        "宪法学": [
            { title: "宪法基本与制度", items: [
                "宪法的最高效力", "宪法的修改程序", "人民代表大会制度", "选举制度的基本原则",
                "国家结构形式", "民族区域自治制度", "特别行政区制度", "基层群众自治制度"
            ]},
            { title: "公民权利与国家机构", items: [
                "平等权", "政治权利与自由", "人身自由", "宗教信仰自由", 
                "全国人大及其常委会的职权", "国家主席的职权", "国务院的职权", "监察委员会的性质"
            ]}
        ],
        "法制史": [
            { title: "古代法制", items: [
                "西周的礼与刑", "《法经》", "汉代文景帝刑制改革", "春秋决狱", 
                "《唐律疏议》的特点", "唐代的十恶", "宋代的折杖法", "明代的厂卫制度", "清代的秋审"
            ]},
            { title: "近现代法制", items: [
                "《钦定宪法大纲》", "《大清新刑律》", "《中华民国临时约法》"
            ]}
        ],
        "刑诉法": [
            { title: "基本制度与程序", items: [
                "立案管辖", "级别管辖", "回避的适用对象", "辩护人的范围", 
                "非法证据排除规则", "取保候审条件", "逮捕的条件", "审查起诉", 
                "认罪认罚从宽制度", "速裁程序"
            ]}
        ],
        "民诉法": [
            { title: "基本制度与程序", items: [
                "专属管辖", "协议管辖", "举证责任倒置", "民事诉讼证据种类", 
                "先予执行条件", "简易程序适用范围", "二审审理范围", "审判监督程序"
            ]}
        ]
    };

    let currentSubject = "刑法";
    let currentAIContent = "";
    let currentAIKeyword = "";

    let favorites = JSON.parse(localStorage.getItem('fs_favorites') || '[]');
    let stats = JSON.parse(localStorage.getItem('fs_stats') || '{"apiCalls":0,"tokens":0,"clicks":0}');
    let apiKey = localStorage.getItem('fs_api_key') || '';

    function init() {
        renderSubjects();
        renderCatalog(currentSubject);
        renderFavorites();
        updateStatsUI();
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function renderSubjects() {
        const container = document.getElementById('subjectList');
        container.innerHTML = subjects.map(sub => 
            `<button class="subject-btn ${sub === currentSubject ? 'active' : ''}" onclick="changeSubject('${sub}')">${sub}</button>`
        ).join('');
    }

    function changeSubject(sub) {
        currentSubject = sub;
        renderSubjects();
        renderCatalog(sub);
    }

    // 渲染折叠目录
    function renderCatalog(sub) {
        const container = document.getElementById('catalogList');
        const chapters = knowledgeTree[sub] || [];
        
        if(chapters.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">暂无数据</div>';
            return;
        }

        // 生成手风琴结构
        container.innerHTML = chapters.map((chapter, index) => `
            <div class="chapter-group">
                <div class="chapter-title" onclick="toggleChapter(${index})">
                    <span>${chapter.title}</span>
                    <span class="arrow" id="arrow-${index}">›</span>
                </div>
                <div class="chapter-items" id="chapter-${index}">
                    ${chapter.items.map(item => `
                        <div class="knowledge-item" onclick="queryAI('${sub} - ${item}')">${item}</div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // 展开/折叠逻辑
    function toggleChapter(index) {
        const itemsContainer = document.getElementById(`chapter-${index}`);
        const arrow = document.getElementById(`arrow-${index}`);
        const title = arrow.parentElement;

        if (itemsContainer.classList.contains('show')) {
            itemsContainer.classList.remove('show');
            title.classList.remove('active');
        } else {
            // 可以注释掉下面两行代码来允许多个章节同时展开
            // document.querySelectorAll('.chapter-items').forEach(el => el.classList.remove('show'));
            // document.querySelectorAll('.chapter-title').forEach(el => el.classList.remove('active'));
            
            itemsContainer.classList.add('show');
            title.classList.add('active');
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabId}`).classList.add('active');
        
        const navs = document.querySelectorAll('.nav-item');
        if(tabId === 'query') navs[0].classList.add('active');
        if(tabId === 'favorites') navs[1].classList.add('active');
        if(tabId === 'settings') navs[2].classList.add('active');

        const titles = {query: '记忆助手', favorites: '知识卡片', settings: '统计与设置'};
        document.getElementById('header-title').innerText = titles[tabId];

        if(tabId === 'favorites') renderFavorites();
        if(tabId === 'settings') updateStatsUI();
    }

    async function queryAI(keyword) {
        stats.clicks++;
        saveStats();

        const modal = document.getElementById('aiModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const favBtn = document.getElementById('favBtn');
        
        modal.classList.add('active');
        modalTitle.innerText = keyword;
        modalBody.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">正在生成解析...</div>';
        favBtn.disabled = true;
        favBtn.style.opacity = '0.5';
        currentAIKeyword = keyword;

        if (!apiKey) {
            setTimeout(() => {
                currentAIContent = `### 知识点\n${keyword}\n\n### 定义\n这是关于“${keyword}”的法学/政治核心概念。\n\n### 理解\n具有法定性、强制性。需结合具体语境拆解。\n\n### 考点\n常考简答题、选择题。注意区分相邻概念。\n\n### 法条详情/核心表述\n《XXX》第X条...\n\n*(⚠️ 当前为模拟数据，请在设置中填入API Key)*`;
                modalBody.innerHTML = marked.parse(currentAIContent);
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            }, 600);
            return;
        }

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {"role": "system", "content": "你是法硕考研/考研政治专家。请严格按照以下Markdown格式输出，不要客套话：\n\n### 定义\n（精准概念）\n\n### 理解\n（通俗拆解法理或原理）\n\n### 考点\n（分点罗列常考点、易混淆点）\n\n### 法条详情/核心表述\n（引用法条原文或经典表述）"},
                        {"role": "user", "content": keyword}
                    ]
                })
            });

            const data = await response.json();
            if(data.choices && data.choices.length > 0) {
                currentAIContent = data.choices[0].message.content;
                modalBody.innerHTML = marked.parse(currentAIContent);
                
                stats.apiCalls++;
                stats.tokens += Math.floor((keyword.length + currentAIContent.length));
                saveStats();
                favBtn.disabled = false;
                favBtn.style.opacity = '1';
            } else {
                modalBody.innerHTML = "<span style='color:red'>API 返回异常。</span>";
            }
        } catch (error) {
            modalBody.innerHTML = `<span style='color:red'>请求失败：${error.message}</span>`;
        }
    }

    function closeModal() {
        document.getElementById('aiModal').classList.remove('active');
    }

    function addToFavorites() {
        if(!currentAIKeyword || !currentAIContent) return;

        const newFav = {
            id: Date.now(),
            title: currentAIKeyword,
            content: currentAIContent,
            time: new Date().toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})
        };

        favorites.push(newFav);
        saveFavorites();
        closeModal();
        alert('已收藏至卡片');
    }

    function renderFavorites() {
        const container = document.getElementById('favoritesContainer');
        if(favorites.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无卡片，快去查询并收藏吧~</div>';
            return;
        }

        const sortedFavs = [...favorites].reverse();
        
        container.innerHTML = sortedFavs.map(fav => {
            return `
            <div class="flashcard">
                <div class="card-header">
                    <div class="card-title">${fav.title}</div>
                    <button class="delete-btn" onclick="deleteFavorite(${fav.id}, event)">删除</button>
                </div>
                <div class="card-body markdown-body">
                    ${marked.parse(fav.content)}
                </div>
                <div class="card-footer">${fav.time}</div>
            </div>
            `;
        }).join('');
    }

    function deleteFavorite(id, event) {
        event.stopPropagation(); 
        if(confirm('确定删除这张卡片吗？')) {
            favorites = favorites.filter(f => f.id !== id);
            saveFavorites();
            renderFavorites();
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        apiKey = key;
        localStorage.setItem('fs_api_key', key);
        alert('API Key 已保存');
    }

    function updateStatsUI() {
        document.getElementById('stat-api-calls').innerText = stats.apiCalls;
        document.getElementById('stat-tokens').innerText = stats.tokens;
        document.getElementById('stat-clicks').innerText = stats.clicks;
    }

    function saveStats() {
        localStorage.setItem('fs_stats', JSON.stringify(stats));
        updateStatsUI();
    }

    function saveFavorites() {
        localStorage.setItem('fs_favorites', JSON.stringify(favorites));
    }

    function exportData() {
        const data = { favorites, stats, exportTime: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fashuo_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.favorites && data.stats) {
                    favorites = data.favorites;
                    stats = data.stats;
                    saveFavorites();
                    saveStats();
                    renderFavorites();
                    updateStatsUI();
                    alert('数据恢复成功！');
                } else {
                    alert('文件格式不正确');
                }
            } catch (err) {
                alert('读取文件失败');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const val = this.value.trim();
            if(val) {
                queryAI(val);
                this.value = ''; 
            }
        }
    });

    init();
</script>
</body>
</html>
